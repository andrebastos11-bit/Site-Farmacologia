<style>
    :root {
        --primary: #0d9488;
        --primary-hover: #0f766e;
        --primary-light: #f0fdfa;
        --primary-border: #99f6e4;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        --radius: 12px;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 40px 20px;
        line-height: 1.5;
    }

    .container {
        max-width: 960px;
        margin: 0 auto;
    }

    header {
        text-align: center;
        margin-bottom: 40px;
    }

    h1 {
        color: var(--text-main);
        font-size: 2.25rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: -0.025em;
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 1.05rem;
        font-weight: 400;
    }

    .search-wrapper {
        position: relative;
        margin-bottom: 40px;
    }

    .search-box {
        width: 100%;
        padding: 16px 20px 16px 50px;
        font-size: 1rem;
        font-family: inherit;
        border: 2px solid var(--border-color);
        border-radius: var(--radius);
        background-color: var(--card-bg);
        color: var(--text-main);
        outline: none;
        transition: all 0.25s ease;
        box-shadow: var(--shadow-sm);
    }

    .search-box:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--primary-light);
    }

    .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
        width: 20px;
        height: 20px;
    }

    /* =====================================================
       GRUPO ATC PRINCIPAL
    ===================================================== */

    .atc-group {
        margin-bottom: 20px;
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow-md);
        overflow: hidden;
        border: 1px solid var(--border-color);
        transition: box-shadow 0.2s ease;
    }

    .atc-group:hover {
        box-shadow: var(--shadow-lg);
    }

    .atc-header {
        background-color: var(--primary-light);
        color: var(--primary-hover);
        padding: 16px 24px;
        font-weight: 700;
        font-size: 1.05rem;
        border-bottom: 1px solid var(--primary-border);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color 0.2s;
    }

    .atc-header:hover {
        background-color: #ccfbf1;
    }

    .atc-header::after, .atc-subheader::after, .atc-level3-header::after, .atc-level4-header::after {
        content: "+";
        font-size: 1.25rem;
        font-weight: 600;
        transition: transform 0.2s;
    }

    /* Níveis Ativos (Expandidos) */
    .atc-content, .atc-subcontent, .atc-level3-content, .atc-level4-content {
        display: none;
    }

    .atc-content.active, .atc-subcontent.active, .atc-level3-content.active, .atc-level4-content.active {
        display: block;
    }

    /* =====================================================
       NÍVEIS ATC
    ===================================================== */

    .atc-subgroup {
        border-bottom: 1px solid var(--border-color);
    }

    .atc-subgroup:last-child {
        border-bottom: none;
    }

    .atc-subheader {
        padding: 14px 24px;
        font-weight: 600;
        color: var(--text-main);
        background: #ffffff;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
    }

    .atc-subheader:hover {
        background-color: var(--bg-color);
    }

    /* Nível 3 */
    .atc-level3 {
        border-top: 1px solid var(--border-color);
    }

    .atc-level3-header {
        padding: 12px 24px 12px 40px;
        font-weight: 500;
        color: #334155;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.9rem;
    }

    .atc-level3-header:hover {
        background-color: var(--bg-color);
    }

    /* Nível 4 */
    .atc-level4 {
        border-top: 1px solid var(--border-color);
    }

    .atc-level4-header {
        padding: 10px 24px 10px 56px;
        color: var(--text-muted);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .atc-level4-header:hover {
        background-color: var(--bg-color);
    }

    /* =====================================================
       LISTA DE MEDICAMENTOS
    ===================================================== */

    .drug-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .drug-item {
        padding: 16px 24px 16px 64px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        transition: background-color 0.2s;
        background: #ffffff;
    }

    .drug-item:last-child {
        border-bottom: none;
    }

    .drug-item:hover {
        background-color: var(--bg-color);
    }

    .drug-info {
        flex: 1;
    }

    .drug-info h3 {
        margin: 0 0 6px 0;
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    .drug-meta {
        font-size: 0.85rem;
        color: var(--text-muted);
    }

    .atc-badge {
        background-color: var(--primary-light);
        padding: 2px 8px;
        border-radius: 6px;
        font-family: monospace;
        font-weight: 600;
        font-size: 0.75rem;
        color: var(--primary-hover);
        border: 1px solid var(--primary-border);
    }

    .drug-link {
        text-decoration: none;
        background-color: var(--primary);
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        white-space: nowrap;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: var(--shadow-sm);
    }

    .drug-link:hover {
        background-color: var(--primary-hover);
    }

    .drug-link:active {
        transform: scale(0.98);
    }

    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        overflow-y: auto;
        padding: 20px;
    }

    .modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        background-color: #ffffff;
        width: 100%;
        max-width: 750px;
        border-radius: calc(var(--radius) * 1.5);
        box-shadow: var(--shadow-lg);
        padding: 36px;
        position: relative;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .close-modal {
        position: absolute;
        right: 24px;
        top: 24px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        font-size: 20px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
    }

    .close-modal:hover {
        background: #e2e8f0;
        color: var(--text-main);
    }

    .modal-content h2 {
        color: var(--text-main);
        font-size: 1.5rem;
        margin-top: 0;
        margin-bottom: 24px;
        padding-right: 40px;
    }

    .modal-section {
        margin-top: 24px;
        background: var(--bg-color);
        padding: 20px;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
    }

    .modal-section h3 {
        color: var(--primary-hover);
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 1rem;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
    }

    .identificacao-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
    }

    .identificacao-item strong {
        display: block;
        color: var(--text-muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
    }

    .identificacao-item span {
        color: var(--text-main);
        font-weight: 500;
    }

    .produto-box {
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 8px;
    }

    .produto-box:last-child {
        margin-bottom: 0;
    }

    .produto-box strong {
        color: var(--primary-hover);
    }

    .rcm-section {
        line-height: 1.6;
        font-size: 0.95rem;
    }

    .video-container {
        margin-top: 12px;
    }

    .video-container iframe {
        width: 100%;
        min-height: 380px;
        border: none;
        border-radius: 8px;
        box-shadow: var(--shadow-sm);
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 650px) {
        body {
            padding: 15px 10px;
        }

        .drug-item {
            flex-direction: column;
            align-items: flex-start;
            padding-left: 20px;
            gap: 12px;
        }

        .drug-link {
            align-self: stretch;
            text-align: center;
        }

        .modal-content {
            padding: 20px;
            max-height: 95vh;
        }

        .video-container iframe {
            min-height: 220px;
        }
    }
</style>


<header>
    <h1>Farmacologia Clínica</h1>
    <p class="subtitle">
        Base de dados estruturada por Classificação ATC
    </p>
</header>

<div class="search-wrapper">
    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Pesquisar por fármaco, classe ou código ATC (ex: Metformina, C10, SGLT2)..."
        onkeyup="filtrarFarmacos()"
    >
</div>

<div id="catalogContainer">
    <p style="text-align: center; color: var(--text-muted); padding: 40px 0;">
        A carregar base de dados...
    </p>
</div>


<div class="modal-content">

    <span class="close-modal" onclick="fecharModal()">&times;</span>

    <h2 id="modalTitulo"></h2>

    <!-- IDENTIFICAÇÃO -->

    <div class="modal-section">

        <h3>Identificação</h3>

        <div class="identificacao-grid">
            <div class="identificacao-item">
                <strong>Substância ativa</strong>
                <span id="modalSubstancia"></span>
            </div>

            <div class="identificacao-item">
                <strong>Classe farmacológica</strong>
                <span id="modalClasse"></span>
            </div>

            <div class="identificacao-item">
                <strong>Alvo terapêutico principal</strong>
                <span id="modalAlvo"></span>
            </div>
        </div>

    </div>


    <!-- MECANISMO -->

    <div class="modal-section">

        <h3>Mecanismo de ação</h3>

        <div id="modalMecanismo" class="rcm-section"></div>

    </div>


    <!-- INDICAÇÕES -->

    <div class="modal-section">

        <h3>Indicações terapêuticas</h3>

        <div id="modalIndicacoes" class="rcm-section"></div>

    </div>


    <!-- PRODUTOS -->

    <div class="modal-section">

        <h3>Produtos</h3>

        <div id="modalProdutos"></div>

    </div>


    <!-- RCM -->

    <div class="modal-section" id="secaoRCM">

        <h3>Resumo das Características do Medicamento</h3>

        <div id="modalRCM" class="rcm-section"></div>

    </div>


    <!-- VÍDEOS -->

    <div class="modal-section" id="secaoVideos">

        <h3>Vídeos</h3>

        <div id="videoDinamica" class="video-container"></div>

        <div id="videoCinetica" class="video-container"></div>

    </div>

</div>
