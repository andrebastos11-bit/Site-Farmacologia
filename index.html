<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Farmacologia Clínica</title>
    <style>
        :root {
            --primary-color: #0f766e;
            --primary-light: #ccfbf1;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }
        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 30px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .search-box:focus {
            border-color: var(--primary-color);
        }
        .atc-group {
            margin-bottom: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .atc-header {
            background-color: var(--primary-light);
            color: var(--primary-color);
            padding: 15px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer; /* Mãozinha para indicar que é clicável */
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background-color 0.2s;
        }
        .atc-header:hover {
            background-color: #99f6e4;
        }
        /* Seta indicativa no cabeçalho */
        .atc-header::after {
            content: '▼';
            font-size: 0.8rem;
            transition: transform 0.3s;
        }
        .atc-group.active .atc-header::after {
            transform: rotate(180deg);
        }

        .drug-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: none; /* Escondido por predefinição */
        }
        .atc-group.active .drug-list {
            display: block; /* Mostra quando o grupo está ativo/clicado */
        }

        .drug-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .drug-item:last-child {
            border-bottom: none;
        }
        .drug-item:hover {
            background-color: #f8fafc;
        }
        .drug-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }
        .drug-meta {
            font-size: 0.85rem;
            color: #64748b;
        }
        .atc-badge {
            background-color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.85rem;
            color: #334155;
        }

        /* Estilos do Modal (Janela de Detalhes) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 4% auto;
            padding: 25px;
            width: 90%;
            max-width: 650px;
            border-radius: 10px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #000;
        }
        .rcm-section {
            margin-top: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .video-container {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Farmacologia Clínica</h1>
            <p class="subtitle">Base de dados estruturada por Classificação ATC</p>
        </header>

        <!-- Caixa de Pesquisa Instantânea -->
        <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar por fármaco, classe ou código ATC (ex: Metformina, C10, SGLT2)..." onkeyup="filtrarFarmacos()">

        <!-- Lista Dinâmica Gerada por JavaScript -->
        <div id="catalogContainer">
            <p style="text-align: center; color: #64748b;">A carregar base de dados...</p>
        </div>
    </div>

    <!-- Modal Dinâmico de Detalhes -->
    <div id="modalDetalhes" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <h2 id="modalTitulo">Detalhes do Fármaco</h2>
            
            <!-- Secção RCM -->
            <div class="rcm-section">
                <h3>Resumo das Características do Medicamento (RCM)</h3>
                <p><strong>Substância Ativa:</strong> <span id="modalSubstancia"></span></p>
                <p><strong>Mecanismo de Ação:</strong> <span id="modalMecanismo"></span></p>
                <p><strong>Indicações Oficiais:</strong> <span id="modalIndicacoes"></span></p>
            </div>

            <!-- Secção de Vídeos -->
            <div class="video-section">
                <h3>Multimédia Educativa</h3>
                
                <div class="video-container">
                    <h4>Farmacodinâmica</h4>
                    <iframe id="videoDinamica" width="100%" height="220" src="" title="Farmacodinâmica" frameborder="0" allowfullscreen></iframe>
                </div>

                <div class="video-container">
                    <h4>Farmacocinética (ADME)</h4>
                    <iframe id="videoCinetica" width="100%" height="220" src="" title="Farmacocinética" frameborder="0" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        let farmacosData = [];

        // Carregar o ficheiro medicamentos.json automaticamente
        fetch('medicamentos.json')
            .then(response => response.json())
            .then(data => {
                farmacosData = data.fármacos;
                renderizarCatalogo(farmacosData);
            })
            .catch(error => {
                console.error('Erro ao carregar o JSON:', error);
                document.getElementById('catalogContainer').innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar a base de dados de medicamentos.</p>';
            });

        function renderizarCatalogo(lista, expandirTudo = false) {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #64748b;">Nenhum fármaco encontrado.</p>';
                return;
            }

            // Agrupar por Grupo ATC principal
            const grupos = {};
            lista.forEach(farmaco => {
                const grupoNome = farmaco.grupo || "Outros";
                if (!grupos[grupoNome]) {
                    grupos[grupoNome] = [];
                }
                grupos[grupoNome].push(farmaco);
            });

            // Criar o HTML para cada grupo ATC
            for (const [grupo, farmacos] of Object.entries(grupos)) {
                let grupoDiv = document.createElement('div');
                grupoDiv.className = 'atc-group';
                if (expandirTudo) {
                    grupoDiv.classList.add('active'); // Se houver pesquisa, mostra os resultados automaticamente
                }

                let headerDiv = document.createElement('div');
                headerDiv.className = 'atc-header';
                headerDiv.textContent = grupo;
                
                // Ao clicar no cabeçalho, alterna entre mostrar/esconder os fármacos deste grupo
                headerDiv.onclick = () => {
                    grupoDiv.classList.toggle('active');
                };

                grupoDiv.appendChild(headerDiv);

                let ul = document.createElement('ul');
                ul.className = 'drug-list';

                farmacos.forEach(f => {
                    let li = document.createElement('li');
                    li.className = 'drug-item';
                    li.onclick = () => abrirDetalhes(f.nome);

                    li.innerHTML = `
                        <div class="drug-info">
                            <h3>${f.nome} <span class="atc-badge">${f.atc}</span></h3>
                            <div class="drug-meta"><strong>Classe:</strong> ${f.classe} | <strong>Indicações:</strong> ${f.indicacoes.join(', ')}</div>
                        </div>
                    `;
                    ul.appendChild(li);
                });

                grupoDiv.appendChild(ul);
                container.appendChild(grupoDiv);
            }
        }

        function abrirDetalhes(nomeFarmaco) {
            const farmaco = farmacosData.find(f => f.nome === nomeFarmaco);
            if (!farmaco) return;

            document.getElementById('modalTitulo').textContent = `${farmaco.nome} (${farmaco.atc})`;
            document.getElementById('modalSubstancia').textContent = farmaco.rcm ? farmaco.rcm.substancia : farmaco.classe;
            document.getElementById('modalMecanismo').textContent = farmaco.mecanismo;
            document.getElementById('modalIndicacoes').textContent = farmaco.indicacoes.join(', ');

            if (farmaco.videos) {
                document.getElementById('videoDinamica').src = farmaco.videos.farmacodinamica || "";
                document.getElementById('videoCinetica').src = farmaco.videos.farmacocinetica || "";
            }

            document.getElementById('modalDetalhes').style.display = "block";
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').style.display = "none";
            document.getElementById('videoDinamica').src = "";
            document.getElementById('videoCinetica').src = "";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modalDetalhes');
            if (event.target == modal) {
                fecharModal();
            }
        }

        // Função de Filtragem em Tempo Real
        function filtrarFarmacos() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            
            if (termo.trim() === "") {
                renderizarCatalogo(farmacosData, false); // Se apagar a pesquisa, recolhe tudo
                return;
            }

            const filtrados = farmacosData.filter(f => 
                f.nome.toLowerCase().includes(termo) ||
                f.atc.toLowerCase().includes(termo) ||
                f.classe.toLowerCase().includes(termo) ||
                f.grupo.toLowerCase().includes(termo) ||
                f.indicacoes.some(ind => ind.toLowerCase().includes(termo))
            );
            
            renderizarCatalogo(filtrados, true); // Se estiver a pesquisar, abre automaticamente os grupos para veres o resultado
        }
    </script>
</body>
</html>
