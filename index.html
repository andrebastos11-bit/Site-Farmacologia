<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vademecum / Consulta de Medicamentos</title>
<style>
  :root {
    --primary-color: #2c3e50;
    --accent-color: #3498db;
    --bg-color: #f8f9fa;
    --card-bg: #ffffff;
    --text-color: #333;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-color); }
  header { background: var(--primary-color); color: #fff; padding: 1.5rem; text-align: center; }
  header h1 { margin: 0 0 4px; }
  header p { margin: 0; opacity: .85; }
  .container { display: flex; max-width: 1500px; margin: 20px auto; gap: 20px; padding: 0 20px; align-items: flex-start; }

  aside { flex: 1.2; min-width: 280px; background: var(--card-bg); padding: 16px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.05); max-height: 85vh; overflow-y: auto; position: sticky; top: 10px; }
  aside h3 { margin: 0 0 10px; color: var(--primary-color); }
  .btn-todos { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 8px; border: 0; background: #e8f1fb; color: var(--primary-color); font-weight: 600; border-radius: 4px; cursor: pointer; }
  .btn-todos:hover { background: #d6e8f8; }
  .atc-tree details { margin-left: 12px; }
  .atc-tree > details { margin-left: 0; }
  .atc-tree summary { cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: .88rem; list-style-position: outside; }
  .atc-tree summary:hover { background: #e2e8f0; color: var(--accent-color); }
  .atc-tree summary.ativo { background: var(--accent-color); color: #fff; }
  .atc-tree .folha { margin-left: 30px; padding: 4px 6px; cursor: pointer; font-size: .85rem; border-radius: 4px; }
  .atc-tree .folha:hover { background: #e2e8f0; color: var(--accent-color); }
  .atc-tree .folha.ativo { background: var(--accent-color); color: #fff; }
  .cod { font-weight: 700; margin-right: 4px; }
  .n { color: #94a3b8; font-size: .8em; }
  .ativo .n { color: #e0efff; }

  main { flex: 3; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .search-box { width: 100%; padding: 12px 20px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
  .search-box:focus { border-color: var(--accent-color); }
  .estado { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: .9rem; color: #64748b; flex-wrap: wrap; }
  .filtro-ativo { background: #e8f1fb; color: var(--primary-color); padding: 3px 10px; border-radius: 12px; }
  .filtro-ativo button { border: 0; background: none; cursor: pointer; color: var(--primary-color); font-weight: 700; }

  .medicamentos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; max-height: 50vh; overflow-y: auto; padding: 2px 6px 2px 2px; }
  .med-card { background: var(--card-bg); padding: 14px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.05); cursor: pointer; transition: transform .2s, box-shadow .2s; border-left: 4px solid var(--accent-color); }
  .med-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.1); }
  .med-card.sel { border-left-color: #e67e22; background: #fffaf3; }
  .med-card h4 { margin: 0 0 6px; color: var(--primary-color); }
  .med-card p { margin: 3px 0; font-size: .85rem; color: #64748b; }

  #detalhe-medicamento { background: var(--card-bg); padding: 20px 24px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.05); }
  #detalhe-medicamento h2 { margin-top: 0; color: var(--primary-color); }
  .caminho { font-size: .85rem; color: #475569; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; line-height: 1.7; }
  .caminho span + span::before { content: ' › '; color: #94a3b8; }
  .campo { margin: 12px 0; }
  .campo strong { display: block; color: var(--primary-color); margin-bottom: 2px; }
  .campo div { white-space: pre-line; line-height: 1.5; }
  .vazio { color: #888; text-align: center; }
  @media (max-width: 900px) {
    .container { flex-direction: column; }
    aside { position: static; width: 100%; max-height: 40vh; }
  }
</style>
</head>
<body>

<header>
  <h1>Base de Dados de Medicamentos</h1>
  <p>Pesquisa rápida e árvore de classificação ATC</p>
</header>

<div class="container">
  <aside>
    <h3>Árvore ATC</h3>
    <button class="btn-todos" onclick="limparFiltroATC()">Mostrar todos</button>
    <div id="atcTree" class="atc-tree"></div>
  </aside>

  <main>
    <input type="text" id="searchBar" class="search-box" placeholder="Pesquisar por nome, substância ativa, indicação ou código ATC...">
    <div class="estado">
      <span id="contador"></span>
      <span id="filtroAtivo"></span>
    </div>
    <div id="medicamentosList" class="medicamentos-grid"></div>
    <div id="detalhe-medicamento">
      <p class="vazio">Clique num medicamento para ver os detalhes completos.</p>
    </div>
  </main>
</div>

<script>
let medicamentos = [];       // dados completos
let filtroNo = null;         // {nivel, codigo, nome}
let medSelecionado = null;

const CAMPOS_DETALHE = [
  ['indicacao_terapeutica', 'Indicação terapêutica'],
  ['posologia', 'Posologia e modo de administração'],
  ['contra_indicacoes', 'Contra-indicações'],
  ['advertencias', 'Advertências e precauções especiais'],
  ['interacoes', 'Interações medicamentosas'],
  ['gravidez_aleitamento', 'Gravidez e aleitamento'],
  ['conducao_maquinas', 'Efeitos sobre a condução e utilização de máquinas'],
  ['efeitos_indesejaveis', 'Efeitos indesejáveis'],
  ['sobredosagem', 'Sobredosagem'],
  ['grupo_farmacoterapeutico', 'Grupo farmacoterapêutico'],
  ['propriedades_farmacodinamicas', 'Propriedades farmacodinâmicas'],
  ['alvo_terapeutico', 'Alvo terapêutico'],
  ['propriedades_farmacocineticas', 'Propriedades farmacocinéticas'],
  ['excipientes', 'Lista dos excipientes'],
  ['incompatibilidades', 'Incompatibilidades'],
  ['conservacao', 'Precauções especiais de conservação'],
  ['instrucoes_utilizacao', 'Instruções de utilização e manipulação']
];

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(t) {
  return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

async function carregarDados() {
  try {
    const resp = await fetch('medicamentos.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    medicamentos = await resp.json();
    medicamentos.forEach(m => {
      m._busca = norm([m.nome_medicamento, m.substancia_ativa, m.indicacao_terapeutica, m.atc,
        (m.atc_niveis || []).map(n => n ? n.codigo + ' ' + n.nome : '').join(' ')].join(' '));
    });
    construirArvoreATC();
    atualizarLista();
  } catch (e) {
    console.error(e);
    document.getElementById('medicamentosList').innerHTML =
      '<p style="color:red">Erro ao carregar medicamentos.json. Verifique se o ficheiro está na mesma pasta e se está a usar um servidor (não abra o ficheiro diretamente).</p>';
  }
}

/* ---------- Árvore ATC ---------- */
function construirArvoreATC() {
  const raiz = {};
  medicamentos.forEach(med => {
    let nivel = raiz;
    (med.atc_niveis || []).forEach((n, k) => {
      if (!n) return;
      if (!nivel[n.codigo]) nivel[n.codigo] = { codigo: n.codigo, nome: n.nome, nivel: k, total: 0, filhos: {} };
      nivel[n.codigo].total++;
      nivel = nivel[n.codigo].filhos;
    });
  });
  const cont = document.getElementById('atcTree');
  cont.innerHTML = '';
  cont.appendChild(renderNos(raiz, true));
}

function renderNos(nos, aberto) {
  const frag = document.createDocumentFragment();
  Object.keys(nos).sort().forEach(cod => {
    const no = nos[cod];
    const rotulo = `<span class="cod">${esc(no.codigo)}</span>${esc(no.nome)} <span class="n">(${no.total})</span>`;
    const temFilhos = Object.keys(no.filhos).length > 0;
    if (temFilhos) {
      const d = document.createElement('details');
      if (aberto) d.open = true;
      const s = document.createElement('summary');
      s.innerHTML = rotulo;
      s.dataset.nivel = no.nivel; s.dataset.codigo = no.codigo;
      s.addEventListener('click', () => definirFiltroATC(no.nivel, no.codigo, no.codigo + ' ' + no.nome));
      d.appendChild(s);
      d.appendChild(renderNos(no.filhos, false));
      frag.appendChild(d);
    } else {
      const f = document.createElement('div');
      f.className = 'folha';
      f.innerHTML = rotulo;
      f.dataset.nivel = no.nivel; f.dataset.codigo = no.codigo;
      f.addEventListener('click', () => definirFiltroATC(no.nivel, no.codigo, no.codigo + ' ' + no.nome));
      frag.appendChild(f);
    }
  });
  return frag;
}

function definirFiltroATC(nivel, codigo, nome) {
  filtroNo = { nivel, codigo, nome };
  marcarAtivoNaArvore();
  atualizarLista();
}
function limparFiltroATC() {
  filtroNo = null;
  marcarAtivoNaArvore();
  atualizarLista();
}
function marcarAtivoNaArvore() {
  document.querySelectorAll('#atcTree .ativo').forEach(e => e.classList.remove('ativo'));
  if (!filtroNo) return;
  document.querySelectorAll('#atcTree [data-codigo]').forEach(e => {
    if (e.dataset.codigo === filtroNo.codigo && Number(e.dataset.nivel) === filtroNo.nivel) e.classList.add('ativo');
  });
}

/* ---------- Lista e pesquisa ---------- */
function filtrar() {
  const termo = norm(document.getElementById('searchBar').value.trim());
  return medicamentos.filter(m => {
    if (filtroNo) {
      const n = (m.atc_niveis || [])[filtroNo.nivel];
      if (!n || n.codigo !== filtroNo.codigo) return false;
    }
    return !termo || m._busca.includes(termo);
  });
}

function atualizarLista() {
  const dados = filtrar();
  document.getElementById('contador').textContent = `${dados.length} de ${medicamentos.length} medicamentos`;
  document.getElementById('filtroAtivo').innerHTML = filtroNo
    ? `<span class="filtro-ativo">ATC: ${esc(filtroNo.nome)} <button onclick="limparFiltroATC()" title="Remover filtro">×</button></span>` : '';
  exibirMedicamentos(dados);
}

function exibirMedicamentos(dados) {
  const c = document.getElementById('medicamentosList');
  c.innerHTML = '';
  if (!dados.length) { c.innerHTML = '<p>Nenhum medicamento encontrado.</p>'; return; }
  dados.forEach(med => {
    const card = document.createElement('div');
    card.className = 'med-card' + (med === medSelecionado ? ' sel' : '');
    card.addEventListener('click', () => mostrarDetalhes(med));
    const formaDose = [med.forma_farmaceutica, med.dosagem].filter(Boolean).join(' – ');
    card.innerHTML = `
      <h4>${esc(med.nome_medicamento || 'Sem nome')}</h4>
      <p><b>Substância:</b> ${esc(med.substancia_ativa || 'N/D')}</p>
      <p><b>Forma/Dosagem:</b> ${esc(formaDose || 'N/D')}</p>
      <p><b>ATC:</b> ${esc(med.atc || 'N/D')}</p>`;
    c.appendChild(card);
  });
}

function mostrarDetalhes(med) {
  medSelecionado = med;
  const formaDose = [med.forma_farmaceutica, med.dosagem].filter(Boolean).join(' – ');
  const caminho = (med.atc_niveis || []).filter(Boolean)
    .map(n => `<span><b>${esc(n.codigo)}</b> ${esc(n.nome)}</span>`).join('');
  const campos = CAMPOS_DETALHE.map(([k, titulo]) =>
    `<div class="campo"><strong>${esc(titulo)}</strong><div>${esc(med[k] || 'N/D')}</div></div>`).join('');
  document.getElementById('detalhe-medicamento').innerHTML = `
    <h2>${esc(med.nome_medicamento || 'Sem nome')}</h2>
    ${caminho ? `<div class="caminho">${caminho}</div>` : ''}
    <div class="campo"><strong>Substância ativa</strong><div>${esc(med.substancia_ativa || 'N/D')}</div></div>
    <div class="campo"><strong>Forma farmacêutica / Dosagem</strong><div>${esc(formaDose || 'N/D')}</div></div>
    <hr>${campos}`;
  document.querySelectorAll('.med-card.sel').forEach(e => e.classList.remove('sel'));
  document.getElementById('detalhe-medicamento').scrollIntoView({ behavior: 'smooth', block: 'start' });
  atualizarLista();
}

document.getElementById('searchBar').addEventListener('input', atualizarLista);
carregarDados();
</script>
</body>
</html>
