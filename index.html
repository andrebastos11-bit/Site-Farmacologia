<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vademecum | Consulta de Medicamentos</title>


<style>

:root {

    --primary: #263b50;
    --accent: #258fc9;
    --accent-soft: #edf7fc;

    --bg: #f5f7f9;
    --card: #ffffff;

    --text: #334155;
    --muted: #64748b;

    --border: #dce5ed;

}


* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--bg);

    color: var(--text);

}


/* =========================================================
   CABEÇALHO
========================================================= */

header {

    background: var(--primary);

    color: white;

    text-align: center;

    padding: 24px 20px;

}


header h1 {

    margin: 0 0 5px;

    font-size: 1.8rem;

}


header p {

    margin: 0;

    opacity: .82;

}


/* =========================================================
   PESQUISA
========================================================= */

.search-area {

    max-width: 1100px;

    margin: 22px auto 18px;

    padding: 0 20px;

    position: relative;

    z-index: 20;

}


.search-wrapper {

    position: relative;

}


.search-box {

    width: 100%;

    padding: 15px 48px 15px 18px;

    border: 1px solid #cbd8e3;

    border-radius: 12px;

    background: white;

    font-size: 1rem;

    color: var(--text);

    outline: none;

    box-shadow:
        0 2px 8px rgba(30, 50, 70, .04);

}


.search-box:focus {

    border-color: var(--accent);

    box-shadow:
        0 0 0 3px rgba(36, 150, 223, .10);

}


.search-icon {

    position: absolute;

    right: 17px;

    top: 50%;

    transform: translateY(-50%);

    color: #8494a4;

    pointer-events: none;

}


.search-results {

    display: none;

    position: absolute;

    top: calc(100% + 7px);

    left: 0;

    right: 0;

    background: white;

    border: 1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        0 12px 30px rgba(30, 50, 70, .15);

    overflow-y: auto;

    max-height: 430px;

}


.search-results.visivel {

    display: block;

}


.search-result {

    padding: 12px 16px;

    cursor: pointer;

    border-bottom: 1px solid #edf1f5;

    display: flex;

    justify-content: space-between;

    gap: 20px;

}


.search-result:hover {

    background: #f5faff;

}


.search-result-name {

    font-weight: 700;

    color: var(--primary);

    margin-bottom: 3px;

}


.search-result-sub {

    font-size: .83rem;

    color: var(--muted);

}


.search-result-reg {

    font-size: .75rem;

    color: #8291a1;

    white-space: nowrap;

}


.sem-resultados {

    padding: 18px;

    text-align: center;

    color: var(--muted);

}


/* =========================================================
   LAYOUT
========================================================= */

.workspace {

    max-width: 1500px;

    margin: 0 auto 40px;

    padding: 0 20px;

    display: grid;

    grid-template-columns:
        340px minmax(0, 1fr);

    gap: 20px;

    align-items: start;

}


/* =========================================================
   ÁRVORE ATC
========================================================= */

.atc-panel {

    background: white;

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 16px 13px 18px;

    position: sticky;

    top: 15px;

    max-height: calc(100vh - 30px);

    overflow-y: auto;

    box-shadow:
        0 3px 12px rgba(30, 50, 70, .04);

}


.atc-panel h2 {

    font-size: 1rem;

    margin: 0 6px 14px;

    color: var(--primary);

}


.atc-help {

    margin: -6px 6px 14px;

    color: #8794a2;

    font-size: .72rem;

    line-height: 1.4;

}


.atc-node {

    position: relative;

}


.atc-children {

    display: none;

    position: relative;

    margin-left: 13px;

    padding-left: 12px;

}


.atc-children::before {

    content: "";

    position: absolute;

    left: 2px;

    top: 0;

    bottom: 6px;

    width: 2px;

    background: #d9eaf6;

    border-radius: 3px;

}


.atc-node.open > .atc-children {

    display: block;

}


.atc-row {

    width: 100%;

    border: 0;

    background: transparent;

    color: var(--text);

    text-align: left;

    padding: 7px;

    margin: 1px 0;

    border-radius: 7px;

    cursor: pointer;

    display: flex;

    align-items: flex-start;

    gap: 6px;

    font-family: inherit;

    line-height: 1.3;

}


.atc-row:hover {

    background: #f3f8fc;

}


.atc-row.active {

    background: var(--accent-soft);

    color: #176ea7;

}


.atc-arrow {

    width: 12px;

    flex: 0 0 12px;

    color: #9aacba;

    font-size: .68rem;

    margin-top: 3px;

    transition:
        transform .18s ease;

}


.atc-node.open >
.atc-row
.atc-arrow {

    transform: rotate(90deg);

}


.atc-code {

    font-weight: 750;

    color: #33536e;

    flex-shrink: 0;

}


.atc-row.active
.atc-code {

    color: #1378b9;

}


.atc-name {

    flex: 1;

    min-width: 0;

}


.atc-count {

    font-size: .72rem;

    color: #9aa8b5;

    white-space: nowrap;

}


.atc-row[data-level="0"] {

    font-size: .87rem;

    font-weight: 650;

}


.atc-row[data-level="1"] {

    font-size: .84rem;

}


.atc-row[data-level="2"],
.atc-row[data-level="3"],
.atc-row[data-level="4"] {

    font-size: .82rem;

}


.atc-row.substance {

    color: #176ea7;

}


.atc-row.substance
.atc-name {

    font-weight: 650;

}


/* =========================================================
   MEDICAMENTOS NA ÁRVORE
========================================================= */

.product-children {

    display: none;

    margin:
        2px 0 5px 26px;

    padding-left: 11px;

    border-left:
        2px solid #dceef9;

}


.atc-node.show-products >
.product-children {

    display: block;

}


.tree-product {

    display: block;

    width: 100%;

    border: 0;

    background: transparent;

    text-align: left;

    padding: 7px 8px;

    border-radius: 6px;

    cursor: pointer;

    font-family: inherit;

    color: #566a7d;

    font-size: .79rem;

}


.tree-product:hover {

    background: #f3f8fc;

    color: #176ea7;

}


.tree-product.active {

    background: #e9f5fc;

    color: #176ea7;

    font-weight: 650;

}


/* =========================================================
   FICHA
========================================================= */

.medicine-panel {

    min-width: 0;

}


#detalhe-medicamento {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 26px;

    box-shadow:
        0 4px 16px rgba(30, 50, 70, .05);

}


.empty-state {

    min-height: 360px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #8795a3;

    text-align: center;

}


.empty-state-icon {

    font-size: 2.6rem;

    opacity: .55;

    margin-bottom: 10px;

}


/* =========================================================
   TRADING CARD
========================================================= */

.trading-card-header {

    display: grid;

    grid-template-columns:
        145px minmax(0, 1fr);

    gap: 26px;

    padding-bottom: 24px;

    border-bottom:
        1px solid var(--border);

}


.coluna-foto-registo {

    display: flex;

    flex-direction: column;

    align-items: center;

}


.produto-foto {

    width: 136px;

    height: 156px;

    border:
        1px solid #d6e1e9;

    border-radius: 11px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


.produto-foto img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    padding: 5px;

}


.registo-abaixo {

    margin-top: 8px;

    text-align: center;

    font-size: .74rem;

    color: #596b7c;

    line-height: 1.35;

}


.registo-abaixo strong {

    color: var(--primary);

}


.produto-info-principal h1 {

    margin: 3px 0 12px;

    color: var(--primary);

    font-size: 1.82rem;

    letter-spacing: -.02em;

}

.marca-registada {

    font-size: .52em;

    vertical-align: super;

    margin-left: 2px;

    font-weight: 700;

}


.produto-info-principal p {

    margin: 6px 0;

    font-size: .92rem;

    line-height: 1.5;

}


.med-link {

    width: fit-content;

    max-width: 100%;

    display: flex;

    align-items: center;

    gap: 7px;

    border: 0;

    background: transparent;

    padding: 2px 0;

    font-family: inherit;

    text-align: left;

    cursor: pointer;

    border-radius: 6px;

    transition:
        color .15s,
        background .15s,
        transform .15s;

}


.med-link:hover {

    color: var(--accent);

    transform: translateX(2px);

}


.med-link:focus-visible {

    outline: 2px solid rgba(37, 143, 201, .28);

    outline-offset: 3px;

}


.med-substancia {

    color: #3d5c78;

    font-size: 1rem;

    margin: 0 0 2px;

}


.med-forma-dose {

    color: #526d86;

    font-size: .95rem;

    margin: 2px 0 0;

}


.med-link-seta {

    font-size: 1.25em;

    line-height: 1;

    color: var(--accent);

    transition: transform .15s;

}


.med-link:hover .med-link-seta {

    transform: translateX(2px);

}


/* =========================================================
   INDICAÇÃO RESUMIDA
========================================================= */

.indicacao-rapida {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    margin-top: 5px;

    padding: 0;

    border: 0;

    background: none;

    color: #536b7e;

    font-family: inherit;

    font-size: .88rem;

    cursor: pointer;

    text-align: left;

}


.indicacao-rapida strong {

    color: var(--primary);

}


.indicacao-rapida:hover {

    color: var(--accent);

}


.indicacao-seta {

    color: var(--accent);

    font-size: 1rem;

}


/* =========================================================
   ATALHOS CLÍNICOS
========================================================= */

.clinical-shortcuts {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 23px;

}


.clinical-button {

    min-width: 112px;

    min-height: 116px;

    border: 1px solid #d8e3ec;

    background: #f8fbfd;

    color: #294b68;

    border-radius: 16px;

    padding: 14px 13px 11px;

    cursor: pointer;

    font-family: inherit;

    text-align: center;

    box-shadow: 0 2px 7px rgba(35, 60, 80, .035);

    transition:
        transform .15s,
        box-shadow .15s,
        border-color .15s,
        filter .15s;

}


.clinical-button:hover {

    transform: translateY(-2px);

    border-color: #b7cbdc;

    box-shadow: 0 7px 18px rgba(35, 60, 80, .09);

    filter: saturate(1.04);

}


/*
   As cores abaixo identificam categorias visuais.
   NÃO representam segurança, risco ou recomendação clínica.
*/

.shortcut-age {

    background: #eef7fd;

    color: #245a7d;

    border-color: #cfe4f2;

}


.shortcut-posologia {

    background: #eef9f5;

    color: #256553;

    border-color: #cee9df;

}


.shortcut-gravidez {

    background: #f4f2fb;

    color: #514b79;

    border-color: #ded9ef;

}


.shortcut-aleitamento {

    background: #f1f5fb;

    color: #405b7b;

    border-color: #d7e0ed;

}


.shortcut-conducao {

    background: #f4f7f9;

    color: #405a6d;

    border-color: #dbe3e8;

}


.shortcut-precaucoes {

    background: #f8f5f1;

    color: #665849;

    border-color: #e8ded3;

}


/* ÍCONE */

.clinical-icon {

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 8px;

}


.clinical-icon svg {

    width: 40px;

    height: 40px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;

}


/* IDADE */

.age-icon {

    width: 43px;

    height: 43px;

    margin: 0 auto 9px;

    border: 2px solid currentColor;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: .94rem;

    font-weight: 800;

}


/* TEXTOS */

.clinical-label {

    display: block;

    font-size: .78rem;

    line-height: 1.15;

    font-weight: 750;

}


.clinical-info {

    display: block;

    margin-top: 7px;

    font-size: .64rem;

    color: currentColor;

    opacity: .66;

    letter-spacing: .02em;

}


.clinical-info::after {

    content: "  →";

    font-size: .78rem;

}


/* =========================================================
   SECÇÕES
========================================================= */

.sections {

    margin-top: 20px;

}


.nivel-secao {

    margin-bottom: 12px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    overflow: hidden;

    background: white;

}


.nivel-secao > summary {

    padding: 14px 18px;

    cursor: pointer;

    color: var(--primary);

    background: #f8fafc;

    user-select: none;

    list-style: none;

    display: grid;

    grid-template-columns: 44px minmax(0, 1fr) 32px;

    align-items: center;

    gap: 12px;

}


.nivel-secao > summary::-webkit-details-marker {

    display: none;

}


.nivel-secao > summary:hover {

    background: #f2f7fa;

}


.section-icon {

    width: 40px;

    height: 40px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 1.15rem;

    background: #edf6fc;

}


.section-title {

    display: block;

    font-weight: 750;

    font-size: .98rem;

    line-height: 1.25;

}


.section-subtitle {

    display: block;

    margin-top: 3px;

    color: #718399;

    font-size: .75rem;

    font-weight: 400;

    line-height: 1.35;

}


.section-chevron {

    width: 30px;

    height: 30px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #edf3f8;

    color: #35546d;

    font-size: 1rem;

    transition: transform .18s ease;

}


.nivel-secao[open] > summary .section-chevron {

    transform: rotate(180deg);

}


#grupo-propriedades .section-icon {

    background: #f2effc;

}


#grupo-farmaceuticas .section-icon {

    background: #fceff4;

}


.sub-secoes-container {

    padding:
        7px 18px 18px;

    border-top:
        1px solid #edf1f4;

}


.campo-sub {

    scroll-margin-top: 20px;

    padding: 15px 4px;

    border-bottom:
        1px solid #edf1f4;

    transition:
        background .3s,
        box-shadow .3s;

}


.campo-sub:last-child {

    border-bottom: 0;

}


.campo-sub > strong {

    display: block;

    color: var(--primary);

    font-size: .93rem;

    margin-bottom: 7px;

}


.campo-texto {

    white-space: pre-line;

    color: #526477;

    line-height: 1.62;

    font-size: .9rem;

}


.campo-sub.highlight {

    background: #fff9dc;

    box-shadow:
        inset 4px 0 0 #e4bd3d;

    border-radius: 6px;

    padding-left: 12px;

}


/* =========================================================
   SUBBLOCOS DO RCM
========================================================= */

.rcm-subbloco {
    scroll-margin-top: 20px;
    margin-top: 16px;
}

.rcm-subbloco:first-child {
    margin-top: 4px;
}

.rcm-subtitulo {
    display: block;
    margin-bottom: 6px;
    color: var(--primary);
    font-size: .88rem;
}

.rcm-subbloco.highlight {
    background: #fff9dc;
    box-shadow: inset 4px 0 0 #e4bd3d;
    border-radius: 6px;
    padding: 10px 12px;
}


.farmaceuticas-grid {

    display: grid;

    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

    gap: 0 28px;

}


.farmaceuticas-coluna {

    min-width: 0;

}


.farmaceuticas-coluna .campo-sub:last-child {

    border-bottom: 0;

}


@media (max-width: 850px) {

    .farmaceuticas-grid {

        grid-template-columns: 1fr;

        gap: 0;

    }

}


/* =========================================================
   EXCIPIENTES
========================================================= */

.excipientes-lista {

    margin: 8px 0 0;

    padding-left: 22px;

    columns: 2;

    column-gap: 35px;

}


.excipientes-lista li {

    break-inside: avoid;

    margin-bottom: 7px;

    color: #526477;

    font-size: .9rem;

    line-height: 1.4;

}


/* =========================================================
   VÍDEOS
========================================================= */

.video-box {

    margin-top: 15px;

    padding-top: 14px;

    border-top:
        1px dashed #dce5eb;

}


.video-box-title {

    font-size: .78rem;

    font-weight: 700;

    color: #65788a;

    margin-bottom: 8px;

}


.video-box iframe {

    width: 100%;

    max-width: 680px;

    aspect-ratio: 16 / 9;

    border: 0;

    border-radius: 10px;

}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 950px) {

    .workspace {

        grid-template-columns:
            1fr;

    }


    .atc-panel {

        position: static;

        max-height: 430px;

    }

}


@media (max-width: 650px) {

    .workspace,
    .search-area {

        padding-left: 12px;

        padding-right: 12px;

    }


    #detalhe-medicamento {

        padding: 17px;

    }


    .trading-card-header {

        grid-template-columns:
            1fr;

    }


    .coluna-foto-registo {

        align-items:
            flex-start;

    }


    .excipientes-lista {

        columns: 1;

    }

}


/* CLASSIFICAÇÃO DE DISPENSA — visual compacto com ícone circular e divisor */
.produto-info-principal { min-width: 0; }
.medicamento-topo { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:7px; }
.medicamento-topo h1 { margin:3px 0 0; }
.dispensa-indicador {
  --dispensa-cor:#2368c5; --dispensa-fundo:#f4f8ff; --dispensa-borda:#bcd5ff;
  display:inline-flex; align-items:center; gap:10px; flex-shrink:0;
  max-width:min(100%, 350px); min-height:49px; box-sizing:border-box;
  padding:6px 13px 6px 7px; border:1px solid var(--dispensa-borda);
  border-radius:18px; background:var(--dispensa-fundo); color:#203a54;
  font-size:.72rem; font-weight:750; line-height:1.28;
  box-shadow:0 3px 12px rgba(29,56,85,.045); cursor:default;
}
.dispensa-icone {
  width:38px; height:38px; flex:0 0 38px; display:flex;
  align-items:center; justify-content:center; border-radius:50%;
  background:color-mix(in srgb, var(--dispensa-cor) 9%, white);
  color:var(--dispensa-cor);
}
.dispensa-icone svg { width:29px; height:29px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.dispensa-msrm .dispensa-icone svg { stroke:none; fill:currentColor; }
.dispensa-separador { width:1px; height:30px; flex:0 0 1px; background:var(--dispensa-borda); }
.dispensa-texto { display:block; min-width:0; }
.dispensa-texto small { display:block; margin-top:2px; font-size:.69rem; font-weight:500; color:#708098; }
.dispensa-msrm { --dispensa-cor:#d72648; --dispensa-fundo:#fff7f9; --dispensa-borda:#ffbdcb; }
.dispensa-mnsrm { --dispensa-cor:#1768dc; --dispensa-fundo:#f5f9ff; --dispensa-borda:#c1d6ff; }
.dispensa-mnsrm-ef { --dispensa-cor:#078f7d; --dispensa-fundo:#f2fbf8; --dispensa-borda:#b5e5d9; }
@media (max-width:650px) {
  .medicamento-topo { flex-direction:column; align-items:flex-start; }
  .dispensa-indicador { max-width:100%; }
}


/* Agrupamento de apresentações */
.tree-brand {width:100%;border:0;background:#f0f7fc;color:#234c6a;border-radius:7px;padding:9px;text-align:left;cursor:pointer;font-weight:700;margin:4px 0;display:flex;justify-content:space-between;gap:8px}
.tree-brand small,.tree-form small{color:#7b90a4;font-weight:400}
.tree-brand-children{display:none;padding-left:12px;border-left:2px solid #dceef9}
.tree-brand-children.open{display:block}
.tree-form{display:block;width:100%;background:none;border:0;text-align:left;padding:7px 4px;cursor:pointer;color:#365a77;font-weight:600}
.tree-form-children{display:none;padding-left:10px}
.tree-form-children.open{display:block}
.tree-product{font-weight:400}
.search-group-more{color:#74899c;font-size:.75rem;white-space:nowrap}
.search-group-choices{border-bottom:1px solid #e6edf3;padding:9px 15px;background:#f8fbfd}
.search-choice{display:block;width:100%;padding:9px 12px;border:0;border-radius:7px;background:white;text-align:left;cursor:pointer;color:#34546d;margin:4px 0}
.search-choice:hover{background:#eaf5fc}
.presentation-picker{margin:16px 0;padding:14px;border:1px solid #dce5ed;border-radius:11px;background:#f8fbfd}

<body>


<header>

    <h1>
        Base de Dados de Medicamentos
    </h1>

    <p>
        Consulta rápida de informação farmacológica e clínica
    </p>

</header>


<!-- =====================================================
     PESQUISA

<div class="search-area">

    <div class="search-wrapper">

        <input
            id="searchBar"
            class="search-box"
            type="text"

        </span>

<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div class="workspace">


    <aside class="atc-panel">

        <h2>
            Classificação ATC
        </h2>

        <div class="atc-help">
            Selecione os níveis sucessivos da classificação.
            Na substância ativa, clique novamente para ver o medicamento.
        </div>

        <div id="atcTree"></div>

    </aside>


    <main class="medicine-panel">

        <div id="detalhe-medicamento">

            <div class="empty-state">

                <div class="empty-state-icon">
                    💊
                </div>

                <strong>
                    Selecione um medicamento
                </strong>

                <span>
                    Utilize a pesquisa ou navegue pela classificação ATC.
                </span>

            </div>

        </div>

    </main>


</div>


<script>


/* =========================================================
   ESTADO
========================================================= */

let medicamentos = [];

let arvoreATC = {};

let medicamentoSelecionado = null;

let ultimoCliqueFolha = null;


/* =========================================================
   SVGs DOS ATALHOS
========================================================= */

const ICONES = {

    posologia: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="8" y="14" width="20" height="26" rx="4"/>
            <path d="M13 14V9h10v5"/>
            <path d="M13 27h10"/>
            <path d="M18 22v10"/>
            <circle cx="34" cy="18" r="9"/>
            <path d="M34 13v5l4 2"/>
        </svg>
    `,

    gravidez: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="19" cy="9" r="4"/>
            <path d="M18 14c-2 5-3 10-2 15 1 6 5 10 11 10"/>
            <path d="M19 17c8 0 13 5 13 12 0 6-4 10-10 10"/>
            <path d="M29 23c2-3 7-1 7 2 0 4-7 8-7 8s-7-4-7-8c0-3 5-5 7-2Z"/>
        </svg>
    `,

    aleitamento: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="18" cy="10" r="4"/>
            <circle cx="31" cy="25" r="5"/>
            <path d="M14 16c-3 5-4 11-2 17 2 5 7 8 13 8"/>
            <path d="M18 18c2 6 6 10 12 11"/>
            <path d="M13 31c5 1 9 0 13-3"/>
            <path d="M25 33c4 0 7-2 9-5"/>
        </svg>
    `,

    conducao: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="18"/>
            <circle cx="24" cy="24" r="4"/>
            <path d="M7 21h34"/>
            <path d="M21 27 14 39"/>
            <path d="M27 27 34 39"/>
        </svg>
    `,

    precaucoes: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M24 6 44 41H4L24 6Z"/>
            <path d="M24 17v12"/>
            <circle cx="24" cy="35" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
    `

};


/* =========================================================
   UTILITÁRIOS
========================================================= */

function esc(valor) {

    return String(
        valor == null ? "" : valor
    ).replace(
        /[&<>"']/g,
        caractere => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[caractere])
    );

}


function norm(valor) {

    return String(valor || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}



/* Agrupar sem perder as apresentações individuais do Excel */
function chaveGrupo(med) {
    return [norm(med.nome_medicamento).trim(), norm(med.substancia_ativa).trim()].join("||");
}
function gruposDeMedicamentos(lista) {
    const mapa = new Map();
    lista.forEach(med => {
        const chave = chaveGrupo(med);
        if (!mapa.has(chave)) mapa.set(chave, { nome: med.nome_medicamento, substancia: med.substancia_ativa, meds: [] });
        mapa.get(chave).meds.push(med);
    });
    return [...mapa.values()].sort((a,b) => a.nome.localeCompare(b.nome,"pt"));
}
function formasDoGrupo(grupo) {
    const mapa = new Map();
    grupo.meds.forEach(med => {
        const forma = (med.forma_farmaceutica || "Forma não indicada").trim();
        const chave = norm(forma);
        if (!mapa.has(chave)) mapa.set(chave, {nome: forma, meds: []});
        mapa.get(chave).meds.push(med);
    });
    return [...mapa.values()].sort((a,b) => a.nome.localeCompare(b.nome,"pt"));
}
function nomeApresentacao(med) {
    return med.dosagem || (med.numero_registo ? "N.º " + med.numero_registo : "Ver ficha");
}
function escolherApresentacao(med) {
    selecionarMedicamento(med);
    searchBar.value = med.nome_medicamento;
    fecharResultadosPesquisa();
}
function adicionarSeletorApresentacoes(med) {
    const relacionados = medicamentos.filter(m => chaveGrupo(m) === chaveGrupo(med));
    if (relacionados.length < 2) return;
    const detalhe = document.getElementById("detalhe-medicamento");
    const painel = document.createElement("div");
    painel.className = "presentation-picker";
    const titulo = document.createElement("div");
    titulo.className = "presentation-picker-title";
    titulo.textContent = "Outras apresentações de " + med.nome_medicamento;
    painel.appendChild(titulo);
    formasDoGrupo({meds: relacionados}).forEach(forma => {
        const rotulo = document.createElement("div");
        rotulo.className = "presentation-form";
        rotulo.textContent = forma.nome;
        painel.appendChild(rotulo);
        const opcoes = document.createElement("div");
        opcoes.className = "presentation-options";
        forma.meds.forEach(item => {
            const botao = document.createElement("button");
            botao.type = "button";
            botao.className = "presentation-option" + (item._id === med._id ? " active" : "");
            botao.textContent = nomeApresentacao(item);
            botao.addEventListener("click", () => selecionarMedicamento(item));
            opcoes.appendChild(botao);
        });
        painel.appendChild(opcoes);
    });
    const header = detalhe.querySelector(".trading-card-header");
    if (header) header.insertAdjacentElement("afterend", painel);
    else detalhe.prepend(painel);
}

/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados() {

    try {

        const resposta =
            await fetch(
                "medicamentos.json"
            );


        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        medicamentos =
            await resposta.json();


        medicamentos.forEach(
            (med, indice) => {

                med._id =
                    indice;


                med._busca =
                    norm([

                        med.nome_medicamento,

                        med.substancia_ativa,

                        med.numero_registo

                    ].join(" "));

            }
        );


        construirDadosATC();

        renderizarArvore();


    } catch (erro) {

        console.error(
            erro
        );

    }

}


/* =========================================================
   CONSTRUIR ÁRVORE
========================================================= */

function construirDadosATC() {

    arvoreATC = {};


    medicamentos.forEach(
        med => {

            let nivelAtual =
                arvoreATC;


            const niveis =
                (
                    med.atc_niveis ||
                    []
                )
                .filter(Boolean);


            niveis.forEach(
                (nivel, indice) => {

                    if (
                        !nivelAtual[
                            nivel.codigo
                        ]
                    ) {

                        nivelAtual[
                            nivel.codigo
                        ] = {

                            codigo:
                                nivel.codigo,

                            nome:
                                nivel.nome,

                            level:
                                indice,

                            total:
                                0,

                            children:
                                {},

                            medicamentos:
                                []

                        };

                    }


                    const no =
                        nivelAtual[
                            nivel.codigo
                        ];


                    no.total++;


                    if (
                        indice ===
                        niveis.length - 1
                    ) {

                        no
                            .medicamentos
                            .push(
                                med
                            );

                    }


                    nivelAtual =
                        no.children;

                }
            );

        }
    );

}


/* =========================================================
   RENDERIZAR ÁRVORE
========================================================= */

function renderizarArvore() {

    const container =
        document.getElementById(
            "atcTree"
        );


    container.innerHTML =
        "";


    Object
        .keys(arvoreATC)
        .sort()
        .forEach(
            codigo => {

                container.appendChild(
                    criarNoATC(
                        arvoreATC[
                            codigo
                        ]
                    )
                );

            }
        );

}


/* =========================================================
   CRIAR NÓ
========================================================= */

function criarNoATC(no) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "atc-node";


    wrapper.dataset.level =
        no.level;


    wrapper.dataset.code =
        no.codigo;


    const row =
        document.createElement(
            "button"
        );


    row.type =
        "button";


    row.className =
        "atc-row";


    row.dataset.level =
        no.level;


    row.dataset.code =
        no.codigo;


    const temFilhos =
        Object.keys(
            no.children
        ).length > 0;


    const eSubstancia =
        no.level === 4;


    if (eSubstancia) {

        row.classList.add(
            "substance"
        );

    }


    let nomeVisivel =
        no.nome;


    if (
        eSubstancia &&
        no.medicamentos.length
    ) {

        nomeVisivel =
            no.medicamentos[0]
                .substancia_ativa
            || no.nome;

    }


    row.innerHTML = `

        <span class="atc-arrow">

            ${
                temFilhos ||
                eSubstancia
                    ? "▶"
                    : ""
            }

        </span>

        <span class="atc-code">

            ${esc(
                no.codigo
            )}

        </span>

        <span class="atc-name">

            ${esc(
                nomeVisivel
            )}

        </span>

        <span class="atc-count">

            (${no.total})

        </span>

    `;


    row.addEventListener(
        "click",
        evento => {

            evento.stopPropagation();

            clicarNoATC(
                wrapper,
                no
            );

        }
    );


    wrapper.appendChild(
        row
    );


    /* FILHOS */

    if (temFilhos) {

        const children =
            document.createElement(
                "div"
            );


        children.className =
            "atc-children";


        Object
            .keys(no.children)
            .sort()
            .forEach(
                codigo => {

                    children.appendChild(
                        criarNoATC(
                            no.children[
                                codigo
                            ]
                        )
                    );

                }
            );


        wrapper.appendChild(
            children
        );

    }


    /* MEDICAMENTOS */

    if (eSubstancia) {

        const products =
            document.createElement(
                "div"
            );


        products.className =
            "product-children";


        gruposDeMedicamentos(no.medicamentos).forEach(grupo => {
            if (grupo.meds.length === 1) {
                const med = grupo.meds[0];
                const botao = document.createElement("button");
                botao.type = "button";
                botao.className = "tree-product";
                botao.dataset.medId = med._id;
                botao.textContent = med.nome_medicamento;
                botao.addEventListener("click", evento => {evento.stopPropagation(); selecionarMedicamento(med);});
                products.appendChild(botao);
                return;
            }
            const marca = document.createElement("button");
            marca.type = "button";
            marca.className = "tree-brand";
            marca.innerHTML = `<span>${esc(grupo.nome)}</span><small>${grupo.meds.length} apresentações ▸</small>`;
            const conteudo = document.createElement("div");
            conteudo.className = "tree-brand-children";
            marca.addEventListener("click", evento => {evento.stopPropagation();conteudo.classList.toggle("open");});
            formasDoGrupo(grupo).forEach(forma => {
                const formaBotao = document.createElement("button");
                formaBotao.type = "button";
                formaBotao.className = "tree-form";
                formaBotao.innerHTML = `${esc(forma.nome)} <small>(${forma.meds.length}) ▸</small>`;
                const apresentacoes = document.createElement("div");
                apresentacoes.className = "tree-form-children";
                formaBotao.addEventListener("click", evento => {evento.stopPropagation();apresentacoes.classList.toggle("open");});
                forma.meds.forEach(med => {
                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.className = "tree-product";
                    botao.dataset.medId = med._id;
                    botao.textContent = nomeApresentacao(med);
                    botao.addEventListener("click", evento => {evento.stopPropagation();selecionarMedicamento(med);});
                    apresentacoes.appendChild(botao);
                });
                conteudo.append(formaBotao, apresentacoes);
            });
            products.append(marca, conteudo);
        });

        wrapper.appendChild(
            products
        );

    }


    return wrapper;

}


/* =========================================================
   CLICAR NA ÁRVORE
========================================================= */

function clicarNoATC(
    wrapper,
    no
) {

    const level =
        no.level;


    const jaAberto =
        wrapper.classList.contains(
            "open"
        );


    if (level === 4) {

        const chave =
            no.codigo;


        if (
            ultimoCliqueFolha ===
            chave
        ) {

            if (
                no.medicamentos.length ===
                1
            ) {

                selecionarMedicamento(
                    no.medicamentos[0]
                );

            } else {

                fecharProdutosDoMesmoNivel(
                    wrapper
                );

                wrapper
                    .classList
                    .toggle(
                        "show-products"
                    );

            }


            ultimoCliqueFolha =
                null;


        } else {

            fecharProdutosDoMesmoNivel(
                wrapper
            );


            marcarNoAtivo(
                wrapper
            );


            ultimoCliqueFolha =
                chave;

        }


        return;

    }


    ultimoCliqueFolha =
        null;


    fecharIrmaos(
        wrapper
    );


    if (jaAberto) {

        fecharRamo(
            wrapper
        );

    } else {

        wrapper.classList.add(
            "open"
        );

        marcarNoAtivo(
            wrapper
        );

    }

}


/* =========================================================
   FECHAR IRMÃOS
========================================================= */

function fecharIrmaos(
    wrapper
) {

    const parent =
        wrapper.parentElement;


    if (!parent) return;


    Array
        .from(
            parent.children
        )
        .forEach(
            irmao => {

                if (
                    irmao !== wrapper &&
                    irmao
                        .classList
                        .contains(
                            "atc-node"
                        )
                ) {

                    fecharRamo(
                        irmao
                    );

                }

            }
        );

}


/* =========================================================
   FECHAR RAMO
========================================================= */

function fecharRamo(
    wrapper
) {

    wrapper
        .classList
        .remove(
            "open",
            "show-products"
        );


    wrapper
        .querySelectorAll(
            ".atc-node"
        )
        .forEach(
            no => {

                no
                    .classList
                    .remove(
                        "open",
                        "show-products"
                    );

            }
        );


    wrapper
        .querySelectorAll(
            ".atc-row"
        )
        .forEach(
            row => {

                row
                    .classList
                    .remove(
                        "active"
                    );

            }
        );

}


/* =========================================================
   PRODUTOS
========================================================= */

function fecharProdutosDoMesmoNivel(
    atual
) {

    document
        .querySelectorAll(
            ".atc-node.show-products"
        )
        .forEach(
            no => {

                if (
                    no !== atual
                ) {

                    no
                        .classList
                        .remove(
                            "show-products"
                        );

                }

            }
        );

}


/* =========================================================
   ATIVO
========================================================= */

function marcarNoAtivo(
    wrapper
) {

    const level =
        wrapper.dataset.level;


    document
        .querySelectorAll(
            `.atc-row[data-level="${level}"]`
        )
        .forEach(
            row => {

                row
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    const row =
        wrapper.querySelector(
            ":scope > .atc-row"
        );


    if (row) {

        row
            .classList
            .add(
                "active"
            );

    }

}


/* =========================================================
   ABRIR CAMINHO DO MEDICAMENTO
========================================================= */

function abrirCaminhoMedicamento(
    med
) {

    document
        .querySelectorAll(
            ".atc-node"
        )
        .forEach(
            no => {

                no
                    .classList
                    .remove(
                        "open",
                        "show-products"
                    );

            }
        );


    document
        .querySelectorAll(
            ".atc-row"
        )
        .forEach(
            row => {

                row
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    const niveis =
        (
            med.atc_niveis ||
            []
        )
        .filter(Boolean);


    niveis.forEach(
        (nivel, indice) => {

            const row =
                document.querySelector(
                    `.atc-row[data-level="${indice}"][data-code="${CSS.escape(nivel.codigo)}"]`
                );


            if (!row) return;


            const wrapper =
                row.closest(
                    ".atc-node"
                );


            row.classList.add(
                "active"
            );


            if (
                indice < 4
            ) {

                wrapper
                    .classList
                    .add(
                        "open"
                    );

            }


            if (
                indice === 4 &&
                wrapper
                    .querySelectorAll(
                        ".tree-product"
                    )
                    .length > 1
            ) {

                wrapper
                    .classList
                    .add(
                        "show-products"
                    );

            }

        }
    );


    document
        .querySelectorAll(
            ".tree-product"
        )
        .forEach(
            botao => {

                botao
                    .classList
                    .toggle(
                        "active",

                        Number(
                            botao.dataset.medId
                        ) ===
                        med._id
                    );

            }
        );

    const selecionado = document.querySelector(`.tree-product[data-med-id="${med._id}"]`);
    if (selecionado) {
        const no = selecionado.closest(".atc-node");
        if (no) no.classList.add("show-products");
        const marca = selecionado.closest(".tree-brand-children");
        if (marca) marca.classList.add("open");
        const forma = selecionado.closest(".tree-form-children");
        if (forma) forma.classList.add("open");
    }

}


/* =========================================================
   PESQUISA
========================================================= */

const searchBar =
    document.getElementById(
        "searchBar"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


searchBar.addEventListener(
    "input",
    pesquisar
);


function pesquisar() {

    const termo =
        norm(
            searchBar
                .value
                .trim()
        );


    if (!termo) {

        fecharResultadosPesquisa();

        return;

    }


    const grupos = gruposDeMedicamentos(medicamentos.filter(med => med._busca.includes(termo))).slice(0,12);
    if (!grupos.length) {
        searchResults.innerHTML = '<div class="sem-resultados">Nenhum medicamento encontrado.</div>';
        searchResults.classList.add("visivel");
        return;
    }
    searchResults.innerHTML = "";
    grupos.forEach(grupo => {
        const linha = document.createElement("div");
        linha.className = "search-result";
        linha.innerHTML = `<div><div class="search-result-name">${esc(grupo.nome)}</div><div class="search-result-sub">${esc(grupo.substancia || "")}</div></div><div class="search-group-more">${grupo.meds.length === 1 ? "Ver ficha" : grupo.meds.length + " apresentações ▾"}</div>`;
        searchResults.appendChild(linha);
        if (grupo.meds.length === 1) {
            linha.addEventListener("click", () => escolherApresentacao(grupo.meds[0]));
        } else {
            const opcoes = document.createElement("div");
            opcoes.className = "search-group-choices";
            opcoes.style.display = "none";
            formasDoGrupo(grupo).forEach(forma => {
                const subtitulo = document.createElement("div");
                subtitulo.className = "presentation-form";
                subtitulo.textContent = forma.nome;
                opcoes.appendChild(subtitulo);
                forma.meds.forEach(med => {
                    const botao = document.createElement("button");
                    botao.type = "button";
                    botao.className = "search-choice";
                    botao.textContent = nomeApresentacao(med) + (med.numero_registo ? " · N.º " + med.numero_registo : "");
                    botao.addEventListener("click", () => escolherApresentacao(med));
                    opcoes.appendChild(botao);
                });
            });
            linha.addEventListener("click", () => {opcoes.style.display = opcoes.style.display === "none" ? "block" : "none";});
            searchResults.appendChild(opcoes);
        }
    });
    searchResults.classList.add("visivel");
}


function fecharResultadosPesquisa() {

    searchResults
        .classList
        .remove(
            "visivel"
        );

}


document.addEventListener(
    "click",
    evento => {

        if (
            !evento
                .target
                .closest(
                    ".search-wrapper"
                )
        ) {

            fecharResultadosPesquisa();

        }

    }
);


/* =========================================================
   SELECIONAR MEDICAMENTO
========================================================= */

function selecionarMedicamento(
    med
) {

    medicamentoSelecionado =
        med;


    abrirCaminhoMedicamento(
        med
    );


    mostrarDetalhes(
        med
    );

    adicionarSeletorApresentacoes(med);

}


/* =========================================================
   ATALHOS
========================================================= */

function criarAtalhosClinicos(
    med
) {

    let html = `

        <div class="clinical-shortcuts">

    `;


    /* IDADE MÍNIMA */

    if (
        med.idade_minima &&

function criarListaExcipientes(
    texto
) {

    if (!texto) {

        return `

            <div class="campo-texto">
                N/D
            </div>

        `;

    }


    const itens =
        String(texto)
        .split(
            /[,;\n]+/
        )
        .map(
            item =>
                item.trim()
        )
        .filter(Boolean);


    if (
        itens.length <= 1
    ) {

        return `

            <div class="campo-texto">

                ${esc(texto)}

            </div>

        `;

    }


    return `

        <ul class="excipientes-lista">

            ${
                itens
                .map(
                    item =>
                        `<li>${esc(item)}</li>`
                )
                .join("")
            }

        </ul>

    `;

}


/* =========================================================
   FERTILIDADE, GRAVIDEZ E ALEITAMENTO
========================================================= */

function formatarGravidezAleitamento(texto) {

    if (!texto) {
        return `<div class="campo-texto">N/D</div>`;
    }

    const original = String(texto).trim();

    /*
       O RCM chega muitas vezes como texto corrido:
       "Gravidez ... Amamentação ..." ou "Gravidez ... Aleitamento ...".
       Aqui apenas melhoramos a apresentação visual; o conteúdo permanece igual.
    */
    const marcadores = [
        { regex: /\bFertilidade\b\s*:?\s*/gi, titulo: "Fertilidade", id: "fertilidade" },
        { regex: /\bGravidez\b\s*:?\s*/gi, titulo: "Gravidez", id: "gravidez" },
        { regex: /\b(?:Amamentação|Aleitamento)\b\s*:?\s*/gi, titulo: "Aleitamento", id: "aleitamento" }
    ];

    let ocorrencias = [];

    marcadores.forEach(marcador => {
        let match;
        marcador.regex.lastIndex = 0;

        while ((match = marcador.regex.exec(original)) !== null) {
            ocorrencias.push({
                index: match.index,
                fim: match.index + match[0].length,
                titulo: marcador.titulo,
                id: marcador.id
            });

            if (match[0].length === 0) break;
        }
    });

    ocorrencias.sort((a, b) => a.index - b.index);

    // Evita falsos positivos repetidos dentro do corpo do texto.
    const primeiras = [];
    const idsVistos = new Set();

    ocorrencias.forEach(item => {
        if (!idsVistos.has(item.id)) {
            idsVistos.add(item.id);
            primeiras.push(item);
        }
    });

    primeiras.sort((a, b) => a.index - b.index);

    if (!primeiras.length) {
        return `<div class="campo-texto">${esc(original)}</div>`;
    }

    let html = "";

    // Preserva eventual texto introdutório antes do primeiro subtítulo.
    if (primeiras[0].index > 0) {
        const intro = original.slice(0, primeiras[0].index).trim();
        if (intro) {
            html += `<div class="campo-texto">${esc(intro)}</div>`;
        }
    }

    primeiras.forEach((item, indice) => {
        const proximo = primeiras[indice + 1];
        const conteudo = original
            .slice(item.fim, proximo ? proximo.index : original.length)
            .trim();

        html += `
            <div class="rcm-subbloco" id="${item.id}">
                <strong class="rcm-subtitulo">${esc(item.titulo)}</strong>
                <div class="campo-texto">${esc(conteudo || "N/D")}</div>
            </div>
        `;
    });

    return html;
}


/* =========================================================
   YOUTUBE
========================================================= */

function converterYoutubeEmbed(
    url
) {

    if (!url) return "";


    const texto =
        String(url).trim();


    if (
        texto.includes(
            "youtube.com/embed/"
        )
    ) {

        return texto;

    }


    let match =
        texto.match(
            /youtube\.com\/watch\?v=([^&]+)/
        );


    if (match) {

        return (
            "https://www.youtube.com/embed/" +
            match[1]
        );

    }


    match =
        texto.match(
            /youtu\.be\/([^?&]+)/
        );


    if (match) {

        return (
            "https://www.youtube.com/embed/" +
            match[1]
        );

    }


    return "";

}


function criarVideo(
    url,
    titulo
) {

    const embed =
        converterYoutubeEmbed(
            url
        );


    if (!embed) {

        return "";

    }


    return `

        <div class="video-box">

            <div class="video-box-title">

                ▶ ${esc(titulo)}

            </div>

            <iframe
                src="${esc(embed)}"
                title="${esc(titulo)}"
                loading="lazy"
                allowfullscreen
            ></iframe>

        </div>

    `;

}

function criarIndicadorDispensa(med) {

        'MSRM': ['Medicamento sujeito a receita médica', ''],
        'MNSRM-EF': ['Medicamento não sujeito a receita médica', 'Exclusivo de farmácia'],
        'MNSRM': ['Medicamento não sujeito a receita médica', '']
    };
    const categoria = categorias[codigo];
    if (!categoria) return '';
    // Ícones personalizados: Rx, cruz de farmácia e carrinho com cápsula.
    const icone = codigo === 'MSRM'
        ? '<text x="3" y="24" font-size="23" font-weight="800" font-family="Arial, sans-serif">R</text><text x="18" y="30" font-size="18" font-weight="800" font-family="Arial, sans-serif">x</text>'
        : codigo === 'MNSRM-EF'
            ? '<path d="M12 3h8v9h9v8h-9v9h-8v-9H3v-8h9z"/>'
            : '<path d="M2.5 5.5h3.8l3.1 17h17.1l2.7-11.5H9"/><circle cx="12.5" cy="28" r="1.3"/><circle cx="24.2" cy="28" r="1.3"/><rect x="13" y="9.5" width="13" height="8" rx="4" transform="rotate(-40 19.5 13.5)"/><path d="M17 10.5l5 6"/>';

/* =========================================================
   IR PARA SECÇÃO
========================================================= */

function irParaSecao(
    id,
    subId = null
) {

    const elemento =
        document.getElementById(
            id
        );


    if (!elemento) return;


    const details =
        elemento.closest(
            "details"
        );


    if (details) {

        details.open =
            true;

    }


    setTimeout(
        () => {

            const alvo =
                subId
                    ? document.getElementById(subId)
                    : elemento;

            const destino =
                alvo || elemento;


            destino.scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "center"

            });


            destino
                .classList
                .add(
                    "highlight"
                );


            setTimeout(
                () => {

                    destino
                        .classList
                        .remove(
                            "highlight"
                        );

                },
                1800
            );

        },
        80
    );

}
