<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Farmacologia Clínica</title>
    <style>
        :root {
            --primary-color: #0f766e;
            --primary-light: #ccfbf1;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }
        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 30px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .search-box:focus {
            border-color: var(--primary-color);
        }
        .atc-group {
            margin-bottom: 30px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .atc-header {
            background-color: var(--primary-light);
            color: var(--primary-color);
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #cbd5e1;
        }
        .drug-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .drug-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        .drug-item:last-child {
            border-bottom: none;
        }
        .drug-item:hover {
            background-color: #f8fafc;
        }
        .drug-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }
        .drug-meta {
            font-size: 0.85rem;
            color: #64748b;
        }
        .atc-badge {
            background-color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.85rem;
            color: #334155;
        }
        .drug-link {
            text-decoration: none;
            background-color: var(--primary-color);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .drug-link:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Farmacologia Clínica</h1>
            <p class="subtitle">Base de dados estruturada por Classificação ATC</p>
        </header>

        <!-- Caixa de Pesquisa Instantânea -->
        <input type="text" id="searchInput" class="search-box" placeholder="Pesquisar por fármaco, classe ou código ATC (ex: Metformina, C10, SGLT2)..." onkeyup="filtrarFarmacos()">

        <!-- Lista Dinâmica Gerada por JavaScript -->
        <div id="catalogContainer">
            <p style="text-align: center; color: #64748b;">A carregar base de dados...</p>
        </div>
    </div>

    <script>
        let farmacosData = [];

        // Carregar o ficheiro medicamentos.json automaticamente
        fetch('medicamentos.json')
            .then(response => response.json())
            .then(data => {
                farmacosData = data.fármacos;
                renderizarCatalogo(farmacosData);
            })
            .catch(error => {
                console.error('Erro ao carregar o JSON:', error);
                document.getElementById('catalogContainer').innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar a base de dados de medicamentos.</p>';
            });

        function renderizarCatalogo(lista) {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #64748b;">Nenhum fármaco encontrado.</p>';
                return;
            }

            // Agrupar por Grupo ATC principal
            const grupos = {};
            lista.forEach(farmaco => {
                const grupoNome = farmaco.grupo || "Outros";
                if (!grupos[grupoNome]) {
                    grupos[grupoNome] = [];
                }
                grupos[grupoNome].push(farmaco);
            });

            // Criar o HTML para cada grupo ATC
            for (const [grupo, farmacos] of Object.entries(grupos)) {
                let grupoDiv = document.createElement('div');
                grupoDiv.className = 'atc-group';

                let headerDiv = document.createElement('div');
                headerDiv.className = 'atc-header';
                headerDiv.textContent = grupo;
                grupoDiv.appendChild(headerDiv);

                let ul = document.createElement('ul');
                ul.className = 'drug-list';

                farmacos.forEach(f => {
                    let li = document.createElement('li');
                    li.className = 'drug-item';

                    li.innerHTML = `
                        <div class="drug-info">
                            <h3>${f.nome} <span class="atc-badge">${f.atc}</span></h3>
                            <div class="drug-meta"><strong>Classe:</strong> ${f.classe} | <strong>Indicações:</strong> ${f.indicacoes.join(', ')}</div>
                        </div>
                        <a href="${f.link}" class="drug-link">Consultar</a>
                    `;
                    ul.appendChild(li);
                });

                grupoDiv.appendChild(ul);
                container.appendChild(grupoDiv);
            }
        }

        // Função de Filtragem em Tempo Real
        function filtrarFarmacos() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = farmacosData.test ? [] : farmacosData.filter(f => 
                f.nome.toLowerCase().includes(termo) ||
                f.atc.toLowerCase().includes(termo) ||
                f.classe.toLowerCase().includes(termo) ||
                f.grupo.toLowerCase().includes(termo) ||
                f.indicacoes.some(ind => ind.toLowerCase().includes(termo))
            );
            renderizarCatalogo(filtrados);
        }
    </script>
</body>
</html>
