        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            const agrupado = {};
            db.fármacos.forEach(f => {
                if (!agrupado[f.grupo]) agrupado[f.grupo] = {};
                if (!agrupado[f.grupo][f.subgrupo2]) agrupado[f.grupo][f.subgrupo2] = {};
                if (!agrupado[f.grupo][f.subgrupo2][f.subgrupo3]) agrupado[f.grupo][f.subgrupo2][f.subgrupo3] = [];
                agrupado[f.grupo][f.subgrupo2][f.subgrupo3].push(f);
            });

            for (let grupo in agrupado) {
                const divGrupo = createCard(grupo, 'nivel-grupo', (e) => {
                    e.stopPropagation();
                    toggleAccordion(divGrupo, '.nivel-grupo');
                });
                
                for (let sub2 in agrupado[grupo]) {
                    const divSub2 = createCard(sub2, 'nivel-sub2', (e) => {
                        e.stopPropagation();
                        toggleAccordion(divSub2, '.nivel-sub2');
                    });
                    
                    for (let sub3 in agrupado[grupo][sub2]) {
                        const divSub3 = createCard(sub3, 'nivel-sub3', (e) => {
                            e.stopPropagation();
                            toggleAccordion(divSub3, '.nivel-sub3');
                        });
                        
                        agrupado[grupo][sub2][sub3].forEach(farmaco => {
                            const divFarmaco = document.createElement('div');
                            divFarmaco.className = 'card nivel-farmaco';
                            divFarmaco.innerHTML = `
                                <strong>${farmaco.nome}</strong> (${farmaco.atc})
                                <div class="detalhes">
                                    <em>Classe:</em> ${farmaco.classe}<br>
                                    <em>Mecanismo:</em> ${farmaco.mecanismo}
                                </div>
                            `;
                            divSub3.querySelector('.children').appendChild(divFarmaco);
                        });
                        divSub2.querySelector('.children').appendChild(divSub3);
                    }
                    divGrupo.querySelector('.children').appendChild(divSub2);
                }
                app.appendChild(divGrupo);
            }
        }

        function createCard(title, className, onClick) {
            const card = document.createElement('div');
            card.className = `card ${className}`;
            card.innerHTML = `<h3>${title}</h3><div class="children"></div>`;
            card.onclick = onClick;
            return card;
        }

        // Lógica de Acordeão: fecha os irmãos ao abrir o atual
        function toggleAccordion(element, selector) {
            const parent = element.parentElement;
            const targetChildren = element.querySelector('.children');
            const isOpen = targetChildren.classList.contains('show');

            // Fecha todos os elementos do mesmo nível que estão dentro do mesmo pai
            parent.querySelectorAll(`:scope > ${selector} > .children`).forEach(child => {
                child.classList.remove('show');
            });

            // Se não estava aberto, abre o selecionado
            if (!isOpen) {
                targetChildren.classList.add('show');
            }
        }

        window.onload = renderApp;
