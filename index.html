<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vademecum | Consulta de Medicamentos</title>


<style>

:root {

    --primary: #263b50;
    --accent: #258fc9;
    --accent-soft: #edf7fc;

    --bg: #f5f7f9;
    --card: #ffffff;

    --text: #334155;
    --muted: #64748b;

    --border: #dce5ed;

}


* {
    box-sizing: border-box;
}


html {
    scroll-behavior: smooth;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--bg);

    color: var(--text);

}


/* =========================================================
   CABEÇALHO
========================================================= */

header {

    background: var(--primary);

    color: white;

    text-align: center;

    padding: 24px 20px;

}


header h1 {

    margin: 0 0 5px;

    font-size: 1.8rem;

}


header p {

    margin: 0;

    opacity: .82;

}


/* =========================================================
   PESQUISA
========================================================= */

.search-area {

    max-width: 1100px;

    margin: 22px auto 18px;

    padding: 0 20px;

    position: relative;

    z-index: 20;

}


.search-wrapper {

    position: relative;

}


.search-box {

    width: 100%;

    padding: 15px 48px 15px 18px;

    border: 1px solid #cbd8e3;

    border-radius: 12px;

    background: white;

    font-size: 1rem;

    color: var(--text);

    outline: none;

    box-shadow:
        0 2px 8px rgba(30, 50, 70, .04);

}


.search-box:focus {

    border-color: var(--accent);

    box-shadow:
        0 0 0 3px rgba(36, 150, 223, .10);

}


.search-icon {

    position: absolute;

    right: 17px;

    top: 50%;

    transform: translateY(-50%);

    color: #8494a4;

    pointer-events: none;

}


.search-results {

    display: none;

    position: absolute;

    top: calc(100% + 7px);

    left: 0;

    right: 0;

    background: white;

    border: 1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        0 12px 30px rgba(30, 50, 70, .15);

    overflow-y: auto;

    max-height: 430px;

}


.search-results.visivel {

    display: block;

}


.search-result {

    padding: 12px 16px;

    cursor: pointer;

    border-bottom: 1px solid #edf1f5;

    display: flex;

    justify-content: space-between;

    gap: 20px;

}


.search-result:hover {

    background: #f5faff;

}


.search-result-name {

    font-weight: 700;

    color: var(--primary);

    margin-bottom: 3px;

}


.search-result-sub {

    font-size: .83rem;

    color: var(--muted);

}


.search-result-reg {

    font-size: .75rem;

    color: #8291a1;

    white-space: nowrap;

}


.sem-resultados {

    padding: 18px;

    text-align: center;

    color: var(--muted);

}


/* =========================================================
   LAYOUT
========================================================= */

.workspace {

    max-width: 1500px;

    margin: 0 auto 40px;

    padding: 0 20px;

    display: grid;

    grid-template-columns:
        340px minmax(0, 1fr);

    gap: 20px;

    align-items: start;

}


/* =========================================================
   ÁRVORE ATC
========================================================= */

.atc-panel {

    background: white;

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 16px 13px 18px;

    position: sticky;

    top: 15px;

    max-height: calc(100vh - 30px);

    overflow-y: auto;

    box-shadow:
        0 3px 12px rgba(30, 50, 70, .04);

}


.atc-panel h2 {

    font-size: 1rem;

    margin: 0 6px 14px;

    color: var(--primary);

}


.atc-help {

    margin: -6px 6px 14px;

    color: #8794a2;

    font-size: .72rem;

    line-height: 1.4;

}


.atc-node {

    position: relative;

}


.atc-children {

    display: none;

    position: relative;

    margin-left: 13px;

    padding-left: 12px;

}


.atc-children::before {

    content: "";

    position: absolute;

    left: 2px;

    top: 0;

    bottom: 6px;

    width: 2px;

    background: #d9eaf6;

    border-radius: 3px;

}


.atc-node.open > .atc-children {

    display: block;

}


.atc-row {

    width: 100%;

    border: 0;

    background: transparent;

    color: var(--text);

    text-align: left;

    padding: 7px;

    margin: 1px 0;

    border-radius: 7px;

    cursor: pointer;

    display: flex;

    align-items: flex-start;

    gap: 6px;

    font-family: inherit;

    line-height: 1.3;

}


.atc-row:hover {

    background: #f3f8fc;

}


.atc-row.active {

    background: var(--accent-soft);

    color: #176ea7;

}


.atc-arrow {

    width: 12px;

    flex: 0 0 12px;

    color: #9aacba;

    font-size: .68rem;

    margin-top: 3px;

    transition:
        transform .18s ease;

}


.atc-node.open >
.atc-row
.atc-arrow {

    transform: rotate(90deg);

}


.atc-code {

    font-weight: 750;

    color: #33536e;

    flex-shrink: 0;

}


.atc-row.active
.atc-code {

    color: #1378b9;

}


.atc-name {

    flex: 1;

    min-width: 0;

}


.atc-count {

    font-size: .72rem;

    color: #9aa8b5;

    white-space: nowrap;

}


.atc-row[data-level="0"] {

    font-size: .87rem;

    font-weight: 650;

}


.atc-row[data-level="1"] {

    font-size: .84rem;

}


.atc-row[data-level="2"],
.atc-row[data-level="3"],
.atc-row[data-level="4"] {

    font-size: .82rem;

}


.atc-row.substance {

    color: #176ea7;

}


.atc-row.substance
.atc-name {

    font-weight: 650;

}


/* =========================================================
   MEDICAMENTOS NA ÁRVORE
========================================================= */

.product-children {

    display: none;

    margin:
        2px 0 5px 26px;

    padding-left: 11px;

    border-left:
        2px solid #dceef9;

}


.atc-node.show-products >
.product-children {

    display: block;

}


.tree-product {

    display: block;

    width: 100%;

    border: 0;

    background: transparent;

    text-align: left;

    padding: 7px 8px;

    border-radius: 6px;

    cursor: pointer;

    font-family: inherit;

    color: #566a7d;

    font-size: .79rem;

}


.tree-product:hover {

    background: #f3f8fc;

    color: #176ea7;

}


.tree-product.active {

    background: #e9f5fc;

    color: #176ea7;

    font-weight: 650;

}


/* =========================================================
   FICHA
========================================================= */

.medicine-panel {

    min-width: 0;

}


#detalhe-medicamento {

    background: white;

    border:
        1px solid var(--border);

    border-radius: 14px;

    padding: 26px;

    box-shadow:
        0 4px 16px rgba(30, 50, 70, .05);

}


.empty-state {

    min-height: 360px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #8795a3;

    text-align: center;

}


.empty-state-icon {

    font-size: 2.6rem;

    opacity: .55;

    margin-bottom: 10px;

}


/* =========================================================
   TRADING CARD
========================================================= */

.trading-card-header {

    display: grid;

    grid-template-columns:
        145px minmax(0, 1fr);

    gap: 26px;

    padding-bottom: 24px;

    border-bottom:
        1px solid var(--border);

}


.coluna-foto-registo {

    display: flex;

    flex-direction: column;

    align-items: center;

}


.produto-foto {

    width: 136px;

    height: 156px;

    border:
        1px solid #d6e1e9;

    border-radius: 11px;

    background: white;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


.produto-foto img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    padding: 5px;

}


.registo-abaixo {

    margin-top: 8px;

    text-align: center;

    font-size: .74rem;

    color: #596b7c;

    line-height: 1.35;

}


.registo-abaixo strong {

    color: var(--primary);

}


.produto-info-principal h1 {

    margin: 3px 0 10px;

    color: var(--primary);

    font-size: 1.65rem;

}


.produto-info-principal p {

    margin: 6px 0;

    font-size: .92rem;

    line-height: 1.5;

}


/* =========================================================
   INDICAÇÃO RESUMIDA
========================================================= */

.indicacao-rapida {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    margin-top: 5px;

    padding: 0;

    border: 0;

    background: none;

    color: #536b7e;

    font-family: inherit;

    font-size: .88rem;

    cursor: pointer;

    text-align: left;

}


.indicacao-rapida strong {

    color: var(--primary);

}


.indicacao-rapida:hover {

    color: var(--accent);

}


.indicacao-seta {

    color: var(--accent);

    font-size: 1rem;

}


/* =========================================================
   ATALHOS CLÍNICOS
========================================================= */

.clinical-shortcuts {

    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 23px;

}


.clinical-button {

    min-width: 105px;

    min-height: 100px;

    border:
        1px solid #d5e0e8;

    background: #fbfcfd;

    color: #425b70;

    border-radius: 14px;

    padding: 11px 12px 9px;

    cursor: pointer;

    font-family: inherit;

    text-align: center;

    transition:
        transform .15s,
        box-shadow .15s,
        background .15s,
        border-color .15s,
        color .15s;

}


.clinical-button:hover {

    transform:
        translateY(-2px);

    background:
        var(--accent-soft);

    border-color:
        #a9d4ea;

    color:
        #1677ac;

    box-shadow:
        0 5px 13px rgba(40, 60, 80, .08);

}


/* ÍCONE */

.clinical-icon {

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 7px;

}


.clinical-icon svg {

    width: 38px;

    height: 38px;

    fill: none;

    stroke: currentColor;

    stroke-width: 1.8;

    stroke-linecap: round;

    stroke-linejoin: round;

}


/* IDADE */

.age-icon {

    width: 39px;

    height: 39px;

    margin: -2px auto 5px;

    border:
        2px solid currentColor;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: .91rem;

    font-weight: 800;

}


/* TEXTOS */

.clinical-label {

    display: block;

    font-size: .75rem;

    line-height: 1.15;

    font-weight: 700;

}


.clinical-info {

    display: block;

    margin-top: 5px;

    font-size: .61rem;

    color: #8b99a5;

    letter-spacing: .02em;

}


.clinical-button:hover
.clinical-info {

    color: #5e8ca7;

}


/* =========================================================
   SECÇÕES
========================================================= */

.sections {

    margin-top: 20px;

}


.nivel-secao {

    margin-bottom: 12px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    overflow: hidden;

    background: white;

}


.nivel-secao > summary {

    padding: 15px 18px;

    cursor: pointer;

    font-weight: 700;

    color: var(--primary);

    background: #f8fafc;

    user-select: none;

}


.nivel-secao > summary:hover {

    background: #f2f7fa;

}


.sub-secoes-container {

    padding:
        7px 18px 18px;

    border-top:
        1px solid #edf1f4;

}


.campo-sub {

    scroll-margin-top: 20px;

    padding: 15px 4px;

    border-bottom:
        1px solid #edf1f4;

    transition:
        background .3s,
        box-shadow .3s;

}


.campo-sub:last-child {

    border-bottom: 0;

}


.campo-sub > strong {

    display: block;

    color: var(--primary);

    font-size: .93rem;

    margin-bottom: 7px;

}


.campo-texto {

    white-space: pre-line;

    color: #526477;

    line-height: 1.62;

    font-size: .9rem;

}


.campo-sub.highlight {

    background: #fff9dc;

    box-shadow:
        inset 4px 0 0 #e4bd3d;

    border-radius: 6px;

    padding-left: 12px;

}


/* =========================================================
   SUBBLOCOS DO RCM
========================================================= */

.rcm-subbloco {
    scroll-margin-top: 20px;
    margin-top: 16px;
}

.rcm-subbloco:first-child {
    margin-top: 4px;
}

.rcm-subtitulo {
    display: block;
    margin-bottom: 6px;
    color: var(--primary);
    font-size: .88rem;
}

.rcm-subbloco.highlight {
    background: #fff9dc;
    box-shadow: inset 4px 0 0 #e4bd3d;
    border-radius: 6px;
    padding: 10px 12px;
}


/* =========================================================
   EXCIPIENTES
========================================================= */

.excipientes-lista {

    margin: 8px 0 0;

    padding-left: 22px;

    columns: 2;

    column-gap: 35px;

}


.excipientes-lista li {

    break-inside: avoid;

    margin-bottom: 7px;

    color: #526477;

    font-size: .9rem;

    line-height: 1.4;

}


/* =========================================================
   VÍDEOS
========================================================= */

.video-box {

    margin-top: 15px;

    padding-top: 14px;

    border-top:
        1px dashed #dce5eb;

}


.video-box-title {

    font-size: .78rem;

    font-weight: 700;

    color: #65788a;

    margin-bottom: 8px;

}


.video-box iframe {

    width: 100%;

    max-width: 680px;

    aspect-ratio: 16 / 9;

    border: 0;

    border-radius: 10px;

}


/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 950px) {

    .workspace {

        grid-template-columns:
            1fr;

    }


    .atc-panel {

        position: static;

        max-height: 430px;

    }

}


@media (max-width: 650px) {

    .workspace,
    .search-area {

        padding-left: 12px;

        padding-right: 12px;

    }


    #detalhe-medicamento {

        padding: 17px;

    }


    .trading-card-header {

        grid-template-columns:
            1fr;

    }


    .coluna-foto-registo {

        align-items:
            flex-start;

    }


    .excipientes-lista {

        columns: 1;

    }

}

</style>

</head>


<body>


<header>

    <h1>
        Base de Dados de Medicamentos
    </h1>

    <p>
        Consulta rápida de informação farmacológica e clínica
    </p>

</header>


<!-- =====================================================
     PESQUISA
===================================================== -->

<div class="search-area">

    <div class="search-wrapper">

        <input
            id="searchBar"
            class="search-box"
            type="text"
            autocomplete="off"
            placeholder="Pesquisar por medicamento, substância ativa ou número de registo..."
        >

        <span class="search-icon">
            ⌕
        </span>

        <div
            id="searchResults"
            class="search-results"
        ></div>

    </div>

</div>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<div class="workspace">


    <aside class="atc-panel">

        <h2>
            Classificação ATC
        </h2>

        <div class="atc-help">
            Selecione os níveis sucessivos da classificação.
            Na substância ativa, clique novamente para ver o medicamento.
        </div>

        <div id="atcTree"></div>

    </aside>


    <main class="medicine-panel">

        <div id="detalhe-medicamento">

            <div class="empty-state">

                <div class="empty-state-icon">
                    💊
                </div>

                <strong>
                    Selecione um medicamento
                </strong>

                <span>
                    Utilize a pesquisa ou navegue pela classificação ATC.
                </span>

            </div>

        </div>

    </main>


</div>


<script>


/* =========================================================
   ESTADO
========================================================= */

let medicamentos = [];

let arvoreATC = {};

let medicamentoSelecionado = null;

let ultimoCliqueFolha = null;


/* =========================================================
   SVGs DOS ATALHOS
========================================================= */

const ICONES = {

    posologia: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="8" y="14" width="20" height="26" rx="4"/>
            <path d="M13 14V9h10v5"/>
            <path d="M13 27h10"/>
            <path d="M18 22v10"/>
            <circle cx="34" cy="18" r="9"/>
            <path d="M34 13v5l4 2"/>
        </svg>
    `,

    gravidez: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="19" cy="9" r="4"/>
            <path d="M18 14c-2 5-3 10-2 15 1 6 5 10 11 10"/>
            <path d="M19 17c8 0 13 5 13 12 0 6-4 10-10 10"/>
            <path d="M29 23c2-3 7-1 7 2 0 4-7 8-7 8s-7-4-7-8c0-3 5-5 7-2Z"/>
        </svg>
    `,

    aleitamento: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="18" cy="10" r="4"/>
            <circle cx="31" cy="25" r="5"/>
            <path d="M14 16c-3 5-4 11-2 17 2 5 7 8 13 8"/>
            <path d="M18 18c2 6 6 10 12 11"/>
            <path d="M13 31c5 1 9 0 13-3"/>
            <path d="M25 33c4 0 7-2 9-5"/>
        </svg>
    `,

    conducao: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="18"/>
            <circle cx="24" cy="24" r="4"/>
            <path d="M7 21h34"/>
            <path d="M21 27 14 39"/>
            <path d="M27 27 34 39"/>
        </svg>
    `,

    precaucoes: `
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M24 6 44 41H4L24 6Z"/>
            <path d="M24 17v12"/>
            <circle cx="24" cy="35" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
    `

};


/* =========================================================
   UTILITÁRIOS
========================================================= */

function esc(valor) {

    return String(
        valor == null ? "" : valor
    ).replace(
        /[&<>"']/g,
        caractere => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[caractere])
    );

}


function norm(valor) {

    return String(valor || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados() {

    try {

        const resposta =
            await fetch(
                "medicamentos.json"
            );


        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        medicamentos =
            await resposta.json();


        medicamentos.forEach(
            (med, indice) => {

                med._id =
                    indice;


                med._busca =
                    norm([

                        med.nome_medicamento,

                        med.substancia_ativa,

                        med.numero_registo

                    ].join(" "));

            }
        );


        construirDadosATC();

        renderizarArvore();


    } catch (erro) {

        console.error(
            erro
        );

    }

}


/* =========================================================
   CONSTRUIR ÁRVORE
========================================================= */

function construirDadosATC() {

    arvoreATC = {};


    medicamentos.forEach(
        med => {

            let nivelAtual =
                arvoreATC;


            const niveis =
                (
                    med.atc_niveis ||
                    []
                )
                .filter(Boolean);


            niveis.forEach(
                (nivel, indice) => {

                    if (
                        !nivelAtual[
                            nivel.codigo
                        ]
                    ) {

                        nivelAtual[
                            nivel.codigo
                        ] = {

                            codigo:
                                nivel.codigo,

                            nome:
                                nivel.nome,

                            level:
                                indice,

                            total:
                                0,

                            children:
                                {},

                            medicamentos:
                                []

                        };

                    }


                    const no =
                        nivelAtual[
                            nivel.codigo
                        ];


                    no.total++;


                    if (
                        indice ===
                        niveis.length - 1
                    ) {

                        no
                            .medicamentos
                            .push(
                                med
                            );

                    }


                    nivelAtual =
                        no.children;

                }
            );

        }
    );

}


/* =========================================================
   RENDERIZAR ÁRVORE
========================================================= */

function renderizarArvore() {

    const container =
        document.getElementById(
            "atcTree"
        );


    container.innerHTML =
        "";


    Object
        .keys(arvoreATC)
        .sort()
        .forEach(
            codigo => {

                container.appendChild(
                    criarNoATC(
                        arvoreATC[
                            codigo
                        ]
                    )
                );

            }
        );

}


/* =========================================================
   CRIAR NÓ
========================================================= */

function criarNoATC(no) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "atc-node";


    wrapper.dataset.level =
        no.level;


    wrapper.dataset.code =
        no.codigo;


    const row =
        document.createElement(
            "button"
        );


    row.type =
        "button";


    row.className =
        "atc-row";


    row.dataset.level =
        no.level;


    row.dataset.code =
        no.codigo;


    const temFilhos =
        Object.keys(
            no.children
        ).length > 0;


    const eSubstancia =
        no.level === 4;


    if (eSubstancia) {

        row.classList.add(
            "substance"
        );

    }


    let nomeVisivel =
        no.nome;


    if (
        eSubstancia &&
        no.medicamentos.length
    ) {

        nomeVisivel =
            no.medicamentos[0]
                .substancia_ativa
            || no.nome;

    }


    row.innerHTML = `

        <span class="atc-arrow">

            ${
                temFilhos ||
                eSubstancia
                    ? "▶"
                    : ""
            }

        </span>

        <span class="atc-code">

            ${esc(
                no.codigo
            )}

        </span>

        <span class="atc-name">

            ${esc(
                nomeVisivel
            )}

        </span>

        <span class="atc-count">

            (${no.total})

        </span>

    `;


    row.addEventListener(
        "click",
        evento => {

            evento.stopPropagation();

            clicarNoATC(
                wrapper,
                no
            );

        }
    );


    wrapper.appendChild(
        row
    );


    /* FILHOS */

    if (temFilhos) {

        const children =
            document.createElement(
                "div"
            );


        children.className =
            "atc-children";


        Object
            .keys(no.children)
            .sort()
            .forEach(
                codigo => {

                    children.appendChild(
                        criarNoATC(
                            no.children[
                                codigo
                            ]
                        )
                    );

                }
            );


        wrapper.appendChild(
            children
        );

    }


    /* MEDICAMENTOS */

    if (eSubstancia) {

        const products =
            document.createElement(
                "div"
            );


        products.className =
            "product-children";


        no.medicamentos.forEach(
            med => {

                const botao =
                    document.createElement(
                        "button"
                    );


                botao.type =
                    "button";


                botao.className =
                    "tree-product";


                botao.dataset.medId =
                    med._id;


                botao.innerHTML = `

                    <strong>

                        ${esc(
                            med.nome_medicamento
                        )}

                    </strong>

                `;


                botao.addEventListener(
                    "click",
                    evento => {

                        evento.stopPropagation();

                        selecionarMedicamento(
                            med
                        );

                    }
                );


                products.appendChild(
                    botao
                );

            }
        );


        wrapper.appendChild(
            products
        );

    }


    return wrapper;

}


/* =========================================================
   CLICAR NA ÁRVORE
========================================================= */

function clicarNoATC(
    wrapper,
    no
) {

    const level =
        no.level;


    const jaAberto =
        wrapper.classList.contains(
            "open"
        );


    if (level === 4) {

        const chave =
            no.codigo;


        if (
            ultimoCliqueFolha ===
            chave
        ) {

            if (
                no.medicamentos.length ===
                1
            ) {

                selecionarMedicamento(
                    no.medicamentos[0]
                );

            } else {

                fecharProdutosDoMesmoNivel(
                    wrapper
                );

                wrapper
                    .classList
                    .toggle(
                        "show-products"
                    );

            }


            ultimoCliqueFolha =
                null;


        } else {

            fecharProdutosDoMesmoNivel(
                wrapper
            );


            marcarNoAtivo(
                wrapper
            );


            ultimoCliqueFolha =
                chave;

        }


        return;

    }


    ultimoCliqueFolha =
        null;


    fecharIrmaos(
        wrapper
    );


    if (jaAberto) {

        fecharRamo(
            wrapper
        );

    } else {

        wrapper.classList.add(
            "open"
        );

        marcarNoAtivo(
            wrapper
        );

    }

}


/* =========================================================
   FECHAR IRMÃOS
========================================================= */

function fecharIrmaos(
    wrapper
) {

    const parent =
        wrapper.parentElement;


    if (!parent) return;


    Array
        .from(
            parent.children
        )
        .forEach(
            irmao => {

                if (
                    irmao !== wrapper &&
                    irmao
                        .classList
                        .contains(
                            "atc-node"
                        )
                ) {

                    fecharRamo(
                        irmao
                    );

                }

            }
        );

}


/* =========================================================
   FECHAR RAMO
========================================================= */

function fecharRamo(
    wrapper
) {

    wrapper
        .classList
        .remove(
            "open",
            "show-products"
        );


    wrapper
        .querySelectorAll(
            ".atc-node"
        )
        .forEach(
            no => {

                no
                    .classList
                    .remove(
                        "open",
                        "show-products"
                    );

            }
        );


    wrapper
        .querySelectorAll(
            ".atc-row"
        )
        .forEach(
            row => {

                row
                    .classList
                    .remove(
                        "active"
                    );

            }
        );

}


/* =========================================================
   PRODUTOS
========================================================= */

function fecharProdutosDoMesmoNivel(
    atual
) {

    document
        .querySelectorAll(
            ".atc-node.show-products"
        )
        .forEach(
            no => {

                if (
                    no !== atual
                ) {

                    no
                        .classList
                        .remove(
                            "show-products"
                        );

                }

            }
        );

}


/* =========================================================
   ATIVO
========================================================= */

function marcarNoAtivo(
    wrapper
) {

    const level =
        wrapper.dataset.level;


    document
        .querySelectorAll(
            `.atc-row[data-level="${level}"]`
        )
        .forEach(
            row => {

                row
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    const row =
        wrapper.querySelector(
            ":scope > .atc-row"
        );


    if (row) {

        row
            .classList
            .add(
                "active"
            );

    }

}


/* =========================================================
   ABRIR CAMINHO DO MEDICAMENTO
========================================================= */

function abrirCaminhoMedicamento(
    med
) {

    document
        .querySelectorAll(
            ".atc-node"
        )
        .forEach(
            no => {

                no
                    .classList
                    .remove(
                        "open",
                        "show-products"
                    );

            }
        );


    document
        .querySelectorAll(
            ".atc-row"
        )
        .forEach(
            row => {

                row
                    .classList
                    .remove(
                        "active"
                    );

            }
        );


    const niveis =
        (
            med.atc_niveis ||
            []
        )
        .filter(Boolean);


    niveis.forEach(
        (nivel, indice) => {

            const row =
                document.querySelector(
                    `.atc-row[data-level="${indice}"][data-code="${CSS.escape(nivel.codigo)}"]`
                );


            if (!row) return;


            const wrapper =
                row.closest(
                    ".atc-node"
                );


            row.classList.add(
                "active"
            );


            if (
                indice < 4
            ) {

                wrapper
                    .classList
                    .add(
                        "open"
                    );

            }


            if (
                indice === 4 &&
                wrapper
                    .querySelectorAll(
                        ".tree-product"
                    )
                    .length > 1
            ) {

                wrapper
                    .classList
                    .add(
                        "show-products"
                    );

            }

        }
    );


    document
        .querySelectorAll(
            ".tree-product"
        )
        .forEach(
            botao => {

                botao
                    .classList
                    .toggle(
                        "active",

                        Number(
                            botao.dataset.medId
                        ) ===
                        med._id
                    );

            }
        );

}

========================================================= */

const searchBar =
    document.getElementById(
        "searchBar"
    );


const searchResults =
    document.getElementById(
        "searchResults"
    );


searchBar.addEventListener(
    "input",
    pesquisar
);


function pesquisar() {

    const termo =
        norm(
            searchBar
                .value
                .trim()
        );


    if (!termo) {

        fecharResultadosPesquisa();

        return;

    }


    const resultados =
        medicamentos
        .filter(
            med =>
                med
                    ._busca
                    .includes(
                        termo
                    )
        )
        .slice(
            0,
            12
        );


    if (
        !resultados.length
    ) {

        searchResults.innerHTML = `

            <div class="sem-resultados">

                Nenhum medicamento encontrado.

            </div>

        `;


        searchResults
            .classList
            .add(
                "visivel"
            );


        return;

    }


    searchResults.innerHTML =
        resultados
        .map(
            med => `

                <div
                    class="search-result"
                    data-med-id="${med._id}"
                >

                    <div>

                        <div class="search-result-name">

                            ${esc(
                                med.nome_medicamento
                            )}

                        </div>

                        <div class="search-result-sub">

                            ${esc(
                                med.substancia_ativa ||
                                ""
                            )}

                        </div>

                    </div>


                    <div class="search-result-reg">

                        ${
                            med.numero_registo

                            ?

                            "N.º " +
                            esc(
                                med.numero_registo
                            )

                            :

                            ""
                        }

                    </div>

                </div>

            `
        )
        .join("");


    searchResults
        .querySelectorAll(
            ".search-result"
        )
        .forEach(
            resultado => {

                resultado.addEventListener(
                    "click",
                    () => {

                        const med =
                            medicamentos[
                                Number(
                                    resultado
                                        .dataset
                                        .medId
                                )
                            ];


                        selecionarMedicamento(
                            med
                        );


                        searchBar.value =
                            med.nome_medicamento;


                        fecharResultadosPesquisa();

                    }
                );

            }
        );


    searchResults
        .classList
        .add(
            "visivel"
        );

}


function fecharResultadosPesquisa() {

    searchResults
        .classList
        .remove(
            "visivel"
        );

}


document.addEventListener(
    "click",
    evento => {

        if (
            !evento
                .target
                .closest(
                    ".search-wrapper"
                )
        ) {

            fecharResultadosPesquisa();

        }

    }
);

function criarListaExcipientes(
    texto
) {

    if (!texto) {

        return `

            <div class="campo-texto">
                N/D
            </div>

        `;

    }


    const itens =
        String(texto)
        .split(
            /[,;\n]+/
        )
        .map(
            item =>
                item.trim()
        )
        .filter(Boolean);


    if (
        itens.length <= 1
    ) {

        return `

            <div class="campo-texto">

                ${esc(texto)}

            </div>

        `;

    }


    return `

        <ul class="excipientes-lista">

            ${
                itens
                .map(
                    item =>
                        `<li>${esc(item)}</li>`
                )
                .join("")
            }

        </ul>

    `;

}


/* =========================================================
   FERTILIDADE, GRAVIDEZ E ALEITAMENTO
========================================================= */

function formatarGravidezAleitamento(texto) {

    if (!texto) {
        return `<div class="campo-texto">N/D</div>`;
    }

    const original = String(texto).trim();

    /*
       O RCM chega muitas vezes como texto corrido:
       "Gravidez ... Amamentação ..." ou "Gravidez ... Aleitamento ...".
       Aqui apenas melhoramos a apresentação visual; o conteúdo permanece igual.
    */
    const marcadores = [
        { regex: /\bFertilidade\b\s*:?\s*/gi, titulo: "Fertilidade", id: "fertilidade" },
        { regex: /\bGravidez\b\s*:?\s*/gi, titulo: "Gravidez", id: "gravidez" },
        { regex: /\b(?:Amamentação|Aleitamento)\b\s*:?\s*/gi, titulo: "Aleitamento", id: "aleitamento" }
    ];

    let ocorrencias = [];

    marcadores.forEach(marcador => {
        let match;
        marcador.regex.lastIndex = 0;

        while ((match = marcador.regex.exec(original)) !== null) {
            ocorrencias.push({
                index: match.index,
                fim: match.index + match[0].length,
                titulo: marcador.titulo,
                id: marcador.id
            });

            if (match[0].length === 0) break;
        }
    });

    ocorrencias.sort((a, b) => a.index - b.index);

    // Evita falsos positivos repetidos dentro do corpo do texto.
    const primeiras = [];
    const idsVistos = new Set();

    ocorrencias.forEach(item => {
        if (!idsVistos.has(item.id)) {
            idsVistos.add(item.id);
            primeiras.push(item);
        }
    });

    primeiras.sort((a, b) => a.index - b.index);

    if (!primeiras.length) {
        return `<div class="campo-texto">${esc(original)}</div>`;
    }

    let html = "";

    // Preserva eventual texto introdutório antes do primeiro subtítulo.
    if (primeiras[0].index > 0) {
        const intro = original.slice(0, primeiras[0].index).trim();
        if (intro) {
            html += `<div class="campo-texto">${esc(intro)}</div>`;
        }
    }

    primeiras.forEach((item, indice) => {
        const proximo = primeiras[indice + 1];
        const conteudo = original
            .slice(item.fim, proximo ? proximo.index : original.length)
            .trim();

        html += `
            <div class="rcm-subbloco" id="${item.id}">
                <strong class="rcm-subtitulo">${esc(item.titulo)}</strong>
                <div class="campo-texto">${esc(conteudo || "N/D")}</div>
            </div>
        `;
    });

    return html;
}


/* =========================================================
   YOUTUBE
========================================================= */

function converterYoutubeEmbed(
    url
) {

    if (!url) return "";


    const texto =
        String(url).trim();


    if (
        texto.includes(
            "youtube.com/embed/"
        )
    ) {

        return texto;

    }


    let match =
        texto.match(
            /youtube\.com\/watch\?v=([^&]+)/
        );


    if (match) {

        return (
            "https://www.youtube.com/embed/" +
            match[1]
        );

    }


    match =
        texto.match(
            /youtu\.be\/([^?&]+)/
        );


    if (match) {

        return (
            "https://www.youtube.com/embed/" +
            match[1]
        );

    }


    return "";

}


function criarVideo(
    url,
    titulo
) {

    const embed =
        converterYoutubeEmbed(
            url
        );


    if (!embed) {

        return "";

    }


    return `

        <div class="video-box">

            <div class="video-box-title">

                ▶ ${esc(titulo)}

            </div>

            <iframe
                src="${esc(embed)}"
                title="${esc(titulo)}"
                loading="lazy"
                allowfullscreen
            ></iframe>

        </div>

    `;

}

/* =========================================================
   IR PARA SECÇÃO
========================================================= */

function irParaSecao(
    id,
    subId = null
) {

    const elemento =
        document.getElementById(
            id
        );


    if (!elemento) return;


    const details =
        elemento.closest(
            "details"
        );


    if (details) {

        details.open =
            true;

    }


    setTimeout(
        () => {

            const alvo =
                subId
                    ? document.getElementById(subId)
                    : elemento;

            const destino =
                alvo || elemento;


            destino.scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "center"

            });


            destino
                .classList
                .add(
                    "highlight"
                );


            setTimeout(
                () => {

                    destino
                        .classList
                        .remove(
                            "highlight"
                        );

                },
                1800
            );

        },
        80
    );

}
