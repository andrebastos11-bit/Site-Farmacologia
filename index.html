<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Farmacologia Clínica</title>

    <style>
        :root {
            --primary-color: #0f766e;
            --primary-light: #ccfbf1;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }

        .search-box {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 30px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .search-box:focus {
            border-color: var(--primary-color);
        }

        /* =====================================================
           GRUPO ATC PRINCIPAL
        ===================================================== */

        .atc-group {
            margin-bottom: 30px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .atc-header {
            background-color: var(--primary-light);
            color: var(--primary-color);
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            border-bottom: 1px solid #cbd5e1;
            cursor: pointer;
        }

        .atc-header:hover {
            opacity: 0.9;
        }

        /* =====================================================
           NÍVEIS ATC
        ===================================================== */

        .atc-content {
            display: none;
        }

        .atc-content.active {
            display: block;
        }

        .atc-subgroup {
            border-bottom: 1px solid #e2e8f0;
        }

        .atc-subgroup:last-child {
            border-bottom: none;
        }

        .atc-subheader {
            padding: 12px 20px;
            font-weight: 600;
            color: var(--text-color);
            background: #ffffff;
            cursor: pointer;
        }

        .atc-subheader:hover {
            background-color: #f8fafc;
        }

        .atc-subcontent {
            display: none;
            background-color: #ffffff;
        }

        .atc-subcontent.active {
            display: block;
        }

        /* Nível 3 */

        .atc-level3 {
            border-top: 1px solid #f1f5f9;
        }

        .atc-level3-header {
            padding: 11px 20px 11px 35px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
        }

        .atc-level3-header:hover {
            background-color: #f8fafc;
        }

        .atc-level3-content {
            display: none;
        }

        .atc-level3-content.active {
            display: block;
        }

        /* Nível 4 */

        .atc-level4 {
            border-top: 1px solid #f1f5f9;
        }

        .atc-level4-header {
            padding: 10px 20px 10px 50px;
            color: #475569;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .atc-level4-header:hover {
            background-color: #f8fafc;
        }

        .atc-level4-content {
            display: none;
        }

        .atc-level4-content.active {
            display: block;
        }

        /* =====================================================
           LISTA DE MEDICAMENTOS
        ===================================================== */

        .drug-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .drug-item {
            padding: 15px 20px 15px 65px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: background-color 0.2s;
        }

        .drug-item:last-child {
            border-bottom: none;
        }

        .drug-item:hover {
            background-color: #f8fafc;
        }

        .drug-info {
            flex: 1;
        }

        .drug-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: var(--text-color);
        }

        .drug-meta {
            font-size: 0.85rem;
            color: #64748b;
        }

        .atc-badge {
            background-color: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.85rem;
            color: #334155;
        }

        .drug-link {
            text-decoration: none;
            background-color: var(--primary-color);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            white-space: nowrap;
        }

        .drug-link:hover {
            opacity: 0.9;
        }

        /* =====================================================
           MODAL
        ===================================================== */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.55);
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background-color: #ffffff;
            max-width: 800px;
            margin: 40px auto;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            padding: 30px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            color: #64748b;
            cursor: pointer;
        }

        .close-modal:hover {
            color: var(--text-color);
        }

        .modal-content h2 {
            color: var(--primary-color);
            margin-top: 0;
            padding-right: 30px;
        }

        .modal-section {
            margin-top: 25px;
        }

        .modal-section h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .identificacao-item {
            margin-bottom: 12px;
        }

        .identificacao-item strong {
            display: block;
            color: #475569;
            margin-bottom: 3px;
        }

        .identificacao-item span {
            color: var(--text-color);
        }

        .produto-box {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #f8fafc;
        }

        .produto-box strong {
            color: var(--primary-color);
        }

        .rcm-section {
            line-height: 1.6;
        }

        .video-container {
            margin-top: 15px;
        }

        .video-container iframe {
            width: 100%;
            min-height: 350px;
            border: none;
            border-radius: 8px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            .drug-item {
                flex-direction: column;
                align-items: flex-start;
                padding-left: 20px;
            }

            .drug-link {
                align-self: flex-end;
            }

            .modal-content {
                margin: 15px;
                padding: 20px;
            }

            .video-container iframe {
                min-height: 220px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Farmacologia Clínica</h1>
        <p class="subtitle">
            Base de dados estruturada por Classificação ATC
        </p>
    </header>

    <input
        type="text"
        id="searchInput"
        class="search-box"
        placeholder="Pesquisar por fármaco, classe ou código ATC (ex: Metformina, C10, SGLT2)..."
        onkeyup="filtrarFarmacos()"
    >

    <div id="catalogContainer">
        <p style="text-align: center; color: #64748b;">
            A carregar base de dados...
        </p>
    </div>

</div>


<!-- =========================================================
     MODAL DO MEDICAMENTO
========================================================= -->

<div id="modalMedicamento" class="modal">

    <div class="modal-content">

        <span class="close-modal" onclick="fecharModal()">&times;</span>

        <h2 id="modalTitulo"></h2>

        <!-- IDENTIFICAÇÃO -->

        <div class="modal-section">

            <h3>Identificação</h3>

            <div class="identificacao-item">
                <strong>Substância ativa</strong>
                <span id="modalSubstancia"></span>
            </div>

            <div class="identificacao-item">
                <strong>Classe farmacológica</strong>
                <span id="modalClasse"></span>
            </div>

            <div class="identificacao-item">
                <strong>Alvo terapêutico principal</strong>
                <span id="modalAlvo"></span>
            </div>

        </div>


        <!-- MECANISMO -->

        <div class="modal-section">

            <h3>Mecanismo de ação</h3>

            <div id="modalMecanismo" class="rcm-section"></div>

        </div>


        <!-- INDICAÇÕES -->

        <div class="modal-section">

            <h3>Indicações terapêuticas</h3>

            <div id="modalIndicacoes" class="rcm-section"></div>

        </div>


        <!-- PRODUTOS -->

        <div class="modal-section">

            <h3>Produtos</h3>

            <div id="modalProdutos"></div>

        </div>


        <!-- RCM -->

        <div class="modal-section" id="secaoRCM">

            <h3>Resumo das Características do Medicamento</h3>

            <div id="modalRCM" class="rcm-section"></div>

        </div>


        <!-- VÍDEOS -->

        <div class="modal-section" id="secaoVideos">

            <h3>Vídeos</h3>

            <div id="videoDinamica" class="video-container"></div>

            <div id="videoCinetica" class="video-container"></div>

        </div>

    </div>

</div>


<script>

    /* =========================================================
       DADOS
    ========================================================= */

    let farmacosData = [];


    /* =========================================================
       DESCRIÇÕES ATC
    ========================================================= */

    const descricoesATC2 = {

        A01: "A01 - PREPARAÇÕES ESTOMATOLÓGICAS",

        A02: "A02 - TRATAMENTO DE ALTERAÇÕES CAUSADAS POR ÁCIDOS",

        A03: "A03 - FÁRMACOS PARA O TRATAMENTO DE ALTERAÇÕES FUNCIONAIS DO ESTÔMAGO E INTESTINOS"

    };


    const descricoesATC3 = {

        A02A: "A02A - ANTIÁCIDOS",

        A02B: "A02B - FÁRMACOS PARA O TRATAMENTO DA ÚLCERA PÉPTICA E DO REFLUXO GASTROESOFÁGICO"

    };


    /* =========================================================
       PALAVRAS QUE PERMANECEM EM MINÚSCULAS
    ========================================================= */

    const palavrasMinusculas = new Set([

        "a",
        "à",
        "ao",
        "aos",
        "as",
        "às",
        "e",
        "da",
        "das",
        "de",
        "do",
        "dos",
        "em",
        "na",
        "nas",
        "no",
        "nos",
        "por",
        "para",
        "com",
        "sem",
        "sob",
        "entre",
        "ou",
        "um",
        "uma",
        "uns",
        "umas"

    ]);


    /* =========================================================
       CAPITALIZAÇÃO
    ========================================================= */

    function capitalizarTexto(texto) {

        if (!texto) return "";

        return String(texto)
            .toLowerCase()
            .split(/\s+/)
            .map((palavra, indice) => {

                if (
                    indice > 0 &&
                    palavrasMinusculas.has(palavra)
                ) {
                    return palavra;
                }

                return palavra.charAt(0).toUpperCase() + palavra.slice(1);

            })
            .join(" ");

    }


    /* =========================================================
       LIMPAR CÓDIGO ATC
    ========================================================= */

    function extrairCodigoATC(valor) {

        if (!valor) return "";

        const correspondencia = String(valor)
            .toUpperCase()
            .match(/[A-Z]\d{2}[A-Z0-9]{0,2}/);

        return correspondencia
            ? correspondencia[0]
            : "";

    }


    /* =========================================================
       OBTER DESCRIÇÃO DE UM GRUPO ATC
    ========================================================= */

    function obterDescricaoATC2(codigo, farmacos) {

        if (descricoesATC2[codigo]) {
            return descricoesATC2[codigo];
        }

        const medicamento = farmacos.find(f => {

            const valor = String(f.subgrupo2 || "");

            return valor.toUpperCase().startsWith(codigo);

        });

        if (medicamento && medicamento.subgrupo2) {
            return formatarNomeATC(medicamento.subgrupo2, codigo);
        }

        return codigo;

    }


    function obterDescricaoATC3(codigo, farmacos) {

        if (descricoesATC3[codigo]) {
            return descricoesATC3[codigo];
        }

        const medicamento = farmacos.find(f => {

            const valor = String(f.subgrupo3 || "");

            return valor.toUpperCase().startsWith(codigo);

        });

        if (medicamento && medicamento.subgrupo3) {
            return formatarNomeATC(medicamento.subgrupo3, codigo);
        }

        return codigo;

    }


    /* =========================================================
       FORMATAR NOME ATC
    ========================================================= */

    function formatarNomeATC(texto, codigo) {

        if (!texto) return codigo;

        let descricao = String(texto).trim();

        descricao = descricao.replace(
            new RegExp("^" + codigo + "\\s*-?\\s*", "i"),
            ""
        );

        descricao = capitalizarTexto(descricao);

        return codigo + " - " + descricao.toUpperCase();

    }


    /* =========================================================
       CARREGAR JSON
    ========================================================= */

    fetch("medicamentos.json")

        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Não foi possível carregar medicamentos.json"
                );
            }

            return response.json();

        })

        .then(data => {

            /*
             * Aceita:
             * { "fármacos": [...] }
             * { "farmacos": [...] }
             * { "medicamentos": [...] }
             * ou diretamente [...]
             */

            if (Array.isArray(data)) {

                farmacosData = data;

            } else if (Array.isArray(data.fármacos)) {

                farmacosData = data.fármacos;

            } else if (Array.isArray(data.farmacos)) {

                farmacosData = data.farmacos;

            } else if (Array.isArray(data.medicamentos)) {

                farmacosData = data.medicamentos;

            } else {

                throw new Error(
                    "Estrutura do ficheiro JSON não reconhecida."
                );

            }

            renderizarCatalogo(farmacosData);

        })

        .catch(error => {

            console.error("Erro ao carregar o JSON:", error);

            document.getElementById("catalogContainer").innerHTML = `

                <p style="
                    text-align: center;
                    color: red;
                ">
                    Erro ao carregar a base de dados de medicamentos.
                </p>

            `;

        });


    /* =========================================================
       RENDERIZAR CATÁLOGO
    ========================================================= */

    function renderizarCatalogo(lista) {

        const container =
            document.getElementById("catalogContainer");

        container.innerHTML = "";

        if (!lista || lista.length === 0) {

            container.innerHTML = `

                <p style="
                    text-align: center;
                    color: #64748b;
                ">
                    Nenhum fármaco encontrado.
                </p>

            `;

            return;
        }


        /* =====================================================
           AGRUPAMENTO PRINCIPAL
        ===================================================== */

        const grupos = {};


        lista.forEach(farmaco => {

            const atc = extrairCodigoATC(farmaco.atc);

            if (!atc) return;

            const codigoPrincipal =
                atc.substring(0, 1);

            const nomeGrupo =
                farmaco.grupo ||
                codigoPrincipal;

            const chave =
                codigoPrincipal + "|" + nomeGrupo;

            if (!grupos[chave]) {

                grupos[chave] = {
                    codigo: codigoPrincipal,
                    nome: nomeGrupo,
                    farmacos: []
                };

            }

            grupos[chave].farmacos.push(farmaco);

        });


        /* =====================================================
           CRIAR CADA GRUPO PRINCIPAL
        ===================================================== */

        Object.values(grupos).forEach(grupo => {

            const grupoDiv =
                document.createElement("div");

            grupoDiv.className = "atc-group";


            /* HEADER PRINCIPAL */

            const header =
                document.createElement("div");

            header.className = "atc-header";

            header.textContent =
                obterNomeGrupoPrincipal(
                    grupo.codigo,
                    grupo.nome
                );

            grupoDiv.appendChild(header);


            /* CONTEÚDO */

            const conteudo =
                document.createElement("div");

            conteudo.className = "atc-content";


            header.addEventListener("click", function () {

                const estavaAberto =
                    conteudo.classList.contains("active");

                fecharIrmaos(conteudo);

                if (!estavaAberto) {
                    conteudo.classList.add("active");
                }

            });


            /* AGRUPAR POR A02, A03, ETC. */

            const subgrupos2 = {};


            grupo.farmacos.forEach(farmaco => {

                const atc =
                    extrairCodigoATC(farmaco.atc);

                const codigo2 =
                    atc.substring(0, 3);

                if (!subgrupos2[codigo2]) {
                    subgrupos2[codigo2] = [];
                }

                subgrupos2[codigo2].push(farmaco);

            });


            Object.entries(subgrupos2).forEach(
                ([codigo2, farmacos2]) => {

                    criarNivel2(
                        conteudo,
                        codigo2,
                        farmacos2
                    );

                }
            );


            grupoDiv.appendChild(conteudo);

            container.appendChild(grupoDiv);

        });

    }


    /* =========================================================
       NÍVEL 1
    ========================================================= */

    function obterNomeGrupoPrincipal(codigo, nome) {

        let descricao = String(nome || "")
            .replace(
                new RegExp("^" + codigo + "\\s*-?\\s*", "i"),
                ""
            )
            .trim();

        if (!descricao) {
            return codigo;
        }

        return (
            codigo +
            " - " +
            capitalizarTexto(descricao).toUpperCase()
        );

    }


    /* =========================================================
       NÍVEL 2
       Ex: A02
    ========================================================= */

    function criarNivel2(
        container,
        codigo2,
        farmacos
    ) {

        const item =
            document.createElement("div");

        item.className = "atc-subgroup";


        const header =
            document.createElement("div");

        header.className = "atc-subheader";

        header.textContent =
            obterDescricaoATC2(
                codigo2,
                farmacos
            );


        const conteudo =
            document.createElement("div");

        conteudo.className = "atc-subcontent";


        header.addEventListener("click", function () {

            const estavaAberto =
                conteudo.classList.contains("active");

            fecharIrmaos(conteudo);

            if (!estavaAberto) {
                conteudo.classList.add("active");
            }

        });


        /* =====================================================
           AGRUPAR POR A02A / A02B
        ===================================================== */

        const subgrupos3 = {};


        farmacos.forEach(farmaco => {

            const atc =
                extrairCodigoATC(farmaco.atc);

            const codigo3 =
                atc.substring(0, 4);

            if (!subgrupos3[codigo3]) {
                subgrupos3[codigo3] = [];
            }

            subgrupos3[codigo3].push(farmaco);

        });


        Object.entries(subgrupos3).forEach(
            ([codigo3, farmacos3]) => {

                criarNivel3(
                    conteudo,
                    codigo3,
                    farmacos3
                );

            }
        );


        item.appendChild(header);
        item.appendChild(conteudo);

        container.appendChild(item);

    }


    /* =========================================================
       NÍVEL 3
       Ex: A02A
    ========================================================= */

    function criarNivel3(
        container,
        codigo3,
        farmacos
    ) {

        const item =
            document.createElement("div");

        item.className = "atc-level3";


        const header =
            document.createElement("div");

        header.className =
            "atc-level3-header";

        header.textContent =
            obterDescricaoATC3(
                codigo3,
                farmacos
            );


        const conteudo =
            document.createElement("div");

        conteudo.className =
            "atc-level3-content";


        header.addEventListener("click", function () {

            const estavaAberto =
                conteudo.classList.contains("active");

            fecharIrmaos(conteudo);

            if (!estavaAberto) {
                conteudo.classList.add("active");
            }

        });


        /* =====================================================
           AGRUPAR POR A02AA / A02BA / ETC.
        ===================================================== */

        const subgrupos4 = {};


        farmacos.forEach(farmaco => {

            const atc =
                extrairCodigoATC(farmaco.atc);

            const codigo4 =
                atc.substring(0, 5);

            if (!subgrupos4[codigo4]) {
                subgrupos4[codigo4] = [];
            }

            subgrupos4[codigo4].push(farmaco);

        });


        Object.entries(subgrupos4).forEach(
            ([codigo4, farmacos4]) => {

                criarNivel4(
                    conteudo,
                    codigo4,
                    farmacos4
                );

            }
        );


        item.appendChild(header);
        item.appendChild(conteudo);

        container.appendChild(item);

    }


    /* =========================================================
       NÍVEL 4
       Ex: A01AA
    ========================================================= */

    function criarNivel4(
        container,
        codigo4,
        farmacos
    ) {

        const item =
            document.createElement("div");

        item.className = "atc-level4";


        const header =
            document.createElement("div");

        header.className =
            "atc-level4-header";


        /*
         * Procurar descrição no JSON.
         */

        let descricao = "";


        const primeiro =
            farmacos[0];


        if (primeiro) {

            const possiveis = [
                primeiro.subgrupo4,
                primeiro.subgrupo3,
                primeiro.classe
            ];


            for (const valor of possiveis) {

                if (!valor) continue;

                const texto =
                    String(valor);

                if (
                    texto
                        .toUpperCase()
                        .startsWith(codigo4)
                ) {

                    descricao =
                        texto.replace(
                            new RegExp(
                                "^" +
                                codigo4 +
                                "\\s*-?\\s*",
                                "i"
                            ),
                            ""
                        )
                        .trim();

                    break;

                }

            }

        }


        if (descricao) {

            header.textContent =
                codigo4 +
                " - " +
                capitalizarTexto(
                    descricao
                ).toUpperCase();

        } else {

            header.textContent =
                codigo4;

        }


        /* =====================================================
           CONTEÚDO
           Aqui entram DIRETAMENTE os medicamentos.
        ===================================================== */

        const conteudo =
            document.createElement("div");

        conteudo.className =
            "atc-level4-content";


        header.addEventListener("click", function () {

            const estavaAberto =
                conteudo.classList.contains("active");

            fecharIrmaos(conteudo);

            if (!estavaAberto) {
                conteudo.classList.add("active");
            }

        });


        const lista =
            document.createElement("ul");

        lista.className =
            "drug-list";


        farmacos.forEach(farmaco => {

            lista.appendChild(
                criarMedicamento(farmaco)
            );

        });


        conteudo.appendChild(lista);

        item.appendChild(header);
        item.appendChild(conteudo);

        container.appendChild(item);

    }


    /* =========================================================
       MEDICAMENTO
    ========================================================= */

    function criarMedicamento(farmaco) {

        const li =
            document.createElement("li");

        li.className =
            "drug-item";


        const info =
            document.createElement("div");

        info.className =
            "drug-info";


        const titulo =
            document.createElement("h3");


        titulo.textContent =
            capitalizarTexto(
                farmaco.nome || ""
            );


        const badge =
            document.createElement("span");

        badge.className =
            "atc-badge";

        badge.textContent =
            farmaco.atc || "";


        titulo.appendChild(
            document.createTextNode(" ")
        );

        titulo.appendChild(badge);


        const meta =
            document.createElement("div");

        meta.className =
            "drug-meta";


        const classe =
            farmaco.classe || "—";


        const indicacoes =
            Array.isArray(farmaco.indicacoes)
                ? farmaco.indicacoes.join(", ")
                : (farmaco.indicacoes || "—");


        meta.innerHTML =
            "<strong>Classe:</strong> " +
            escapeHTML(classe) +
            " | " +
            "<strong>Indicações:</strong> " +
            escapeHTML(indicacoes);


        info.appendChild(titulo);
        info.appendChild(meta);


        /* BOTÃO CONSULTAR */

        const botao =
            document.createElement("button");

        botao.className =
            "drug-link";

        botao.type =
            "button";

        botao.textContent =
            "Consultar";


        botao.addEventListener(
            "click",
            function () {

                abrirDetalhes(farmaco);

            }
        );


        li.appendChild(info);
        li.appendChild(botao);


        return li;

    }


    /* =========================================================
       FECHAR IRMÃOS
       Apenas os elementos do MESMO nível.
    ========================================================= */

    function fecharIrmaos(elemento) {

        if (!elemento.parentElement) {
            return;
        }


        Array.from(
            elemento.parentElement.children
        ).forEach(irmao => {

            if (irmao === elemento) {
                return;
            }


            const conteudos =
                irmao.querySelectorAll(
                    ":scope > .atc-content, " +
                    ":scope > .atc-subcontent, " +
                    ":scope > .atc-level3-content, " +
                    ":scope > .atc-level4-content"
                );


            conteudos.forEach(
                conteudo => {
                    conteudo.classList.remove("active");
                }
            );

        });

    }


    /* =========================================================
       PESQUISA
    ========================================================= */

    function filtrarFarmacos() {

        const termo =
            document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();


        if (!termo) {

            renderizarCatalogo(
                farmacosData
            );

            return;

        }


        const filtrados =
            farmacosData.filter(farmaco => {

                const indicacoes =
                    Array.isArray(
                        farmaco.indicacoes
                    )
                        ? farmaco.indicacoes.join(" ")
                        : (
                            farmaco.indicacoes ||
                            ""
                        );


                const texto =
                    [

                        farmaco.nome,

                        farmaco.atc,

                        farmaco.grupo,

                        farmaco.subgrupo2,

                        farmaco.subgrupo3,

                        farmaco.subgrupo4,

                        farmaco.classe,

                        farmaco.alvoPrincipal,

                        farmaco.mecanismo,

                        indicacoes

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                return texto.includes(termo);

            });


        renderizarCatalogo(
            filtrados
        );

    }


    /* =========================================================
       ABRIR DETALHES
    ========================================================= */

    function abrirDetalhes(farmaco) {

        document.getElementById(
            "modalTitulo"
        ).textContent =
            capitalizarTexto(
                farmaco.nome || ""
            );


        /* IDENTIFICAÇÃO */

        document.getElementById(
            "modalSubstancia"
        ).textContent =
            capitalizarTexto(
                farmaco.nome || "—"
            );


        document.getElementById(
            "modalClasse"
        ).textContent =
            farmaco.classe || "—";


        document.getElementById(
            "modalAlvo"
        ).textContent =
            farmaco.alvoPrincipal || "—";


        /* MECANISMO */

        document.getElementById(
            "modalMecanismo"
        ).innerHTML =
            formatarMecanismo(
                farmaco.mecanismo
            );


        /* INDICAÇÕES */

        const indicacoes =
            Array.isArray(
                farmaco.indicacoes
            )
                ? farmaco.indicacoes
                : (
                    farmaco.indicacoes
                        ? [farmaco.indicacoes]
                        : []
                );


        document.getElementById(
            "modalIndicacoes"
        ).innerHTML =
            indicacoes.length
                ? "<ul>" +
                  indicacoes
                    .map(
                        indicacao =>
                            "<li>" +
                            escapeHTML(indicacao) +
                            "</li>"
                    )
                    .join("") +
                  "</ul>"
                : "—";


        /* PRODUTOS */

        const produtos =
            document.getElementById(
                "modalProdutos"
            );

        produtos.innerHTML = "";


        if (
            Array.isArray(
                farmaco.produtos
            ) &&
            farmaco.produtos.length
        ) {

            farmaco.produtos.forEach(
                produto => {

                    const box =
                        document.createElement(
                            "div"
                        );

                    box.className =
                        "produto-box";


                    if (
                        typeof produto ===
                        "string"
                    ) {

                        box.textContent =
                            produto;

                    } else {

                        const nome =
                            produto.nome ||
                            produto.marca ||
                            "";


                        const apresentacao =
                            produto.apresentacao ||
                            produto.dosagem ||
                            "";


                        box.innerHTML =
                            "<strong>" +
                            escapeHTML(nome) +
                            "</strong>" +
                            (
                                apresentacao
                                    ? "<br>" +
                                      escapeHTML(
                                          apresentacao
                                      )
                                    : ""
                            );

                    }


                    produtos.appendChild(
                        box
                    );

                }
            );

        } else {

            produtos.textContent =
                "—";

        }


        /* RCM */

        const secaoRCM =
            document.getElementById(
                "secaoRCM"
            );

        const modalRCM =
            document.getElementById(
                "modalRCM"
            );


        if (farmaco.rcm) {

            secaoRCM.style.display =
                "block";

            modalRCM.innerHTML =
                formatarMecanismo(
                    farmaco.rcm
                );

        } else {

            secaoRCM.style.display =
                "none";

            modalRCM.innerHTML =
                "";

        }


        /* VÍDEOS */

        prepararVideos(
            farmaco.videos
        );


        /* ABRIR MODAL */

        document
            .getElementById(
                "modalMedicamento"
            )
            .classList.add("active");


        document.body.style.overflow =
            "hidden";

    }


    /* =========================================================
       FORMATAR MECANISMO / RCM
    ========================================================= */

    function formatarMecanismo(texto) {

        if (!texto) {
            return "—";
        }


        let resultado =
            String(texto);


        /*
         * Caso o JSON contenha HTML escapado:
         *
         * &lt;br&gt;
         * &lt;i&gt;
         *
         * converte novamente.
         */

        resultado =
            resultado
                .replace(/&lt;/gi, "<")
                .replace(/&gt;/gi, ">")
                .replace(/&amp;/gi, "&");


        /*
         * Converter quebras de linha normais.
         */

        resultado =
            resultado.replace(
                /\r?\n/g,
                "<br>"
            );


        return resultado;

    }


    /* =========================================================
       VÍDEOS
    ========================================================= */

    function prepararVideos(videos) {

        const dinamica =
            document.getElementById(
                "videoDinamica"
            );

        const cinetica =
            document.getElementById(
                "videoCinetica"
            );

        const secao =
            document.getElementById(
                "secaoVideos"
            );


        dinamica.innerHTML = "";
        cinetica.innerHTML = "";


        if (!videos) {

            secao.style.display =
                "none";

            return;

        }


        let encontrouVideo =
            false;


        if (videos.dinamica) {

            const iframe =
                criarIframeYoutube(
                    videos.dinamica
                );

            if (iframe) {

                dinamica.appendChild(
                    iframe
                );

                encontrouVideo =
                    true;

            }

        }


        if (videos.cinetica) {

            const iframe =
                criarIframeYoutube(
                    videos.cinetica
                );

            if (iframe) {

                cinetica.appendChild(
                    iframe
                );

                encontrouVideo =
                    true;

            }

        }


        secao.style.display =
            encontrouVideo
                ? "block"
                : "none";

    }


    /* =========================================================
       YOUTUBE
    ========================================================= */

    function criarIframeYoutube(url) {

        if (!url) {
            return null;
        }


        let videoId = "";


        const texto =
            String(url);


        const matchYoutube =
            texto.match(
                /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/
            );


        if (matchYoutube) {

            videoId =
                matchYoutube[1];

        } else if (
            /^[A-Za-z0-9_-]{11}$/.test(
                texto
            )
        ) {

            videoId =
                texto;

        }


        if (!videoId) {
            return null;
        }


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            "https://www.youtube.com/embed/" +
            videoId;


        iframe.title =
            "Vídeo educativo";


        iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


        iframe.allowFullscreen =
            true;


        return iframe;

    }


    /* =========================================================
       FECHAR MODAL
    ========================================================= */

    function fecharModal() {

        document
            .getElementById(
                "modalMedicamento"
            )
            .classList.remove("active");


        document.body.style.overflow =
            "";

    }


    /* =========================================================
       FECHAR COM ESC
    ========================================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                fecharModal();

            }

        }
    );


    /* =========================================================
       FECHAR AO CLICAR FORA
    ========================================================= */

    document
        .getElementById(
            "modalMedicamento"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target === this
                ) {

                    fecharModal();

                }

            }
        );


    /* =========================================================
       ESCAPE HTML
    ========================================================= */

    function escapeHTML(valor) {

        return String(valor ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>
